<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>コエリアル</title>
  <meta name="description" content="声のBeReal。毎日ランダムな時刻に通知が届き、30秒以内にそのときの声を残す。加工なし、フィルターなし。">
  <meta property="og:title" content="コエリアル - 声のBeReal">
  <meta property="og:description" content="毎日ランダムな時刻に通知が届き、30秒以内にそのときの声を残す。加工なし、フィルターなし。">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/ogp.svg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root{
      --bg:#111111;--surface:#1c1c1e;--surface2:#2c2c2e;
      --text:#f5f5f7;--text2:#aeaeb2;--accent:#0a84ff;
      --danger:#ff453a;--success:#30d158;--warning:#ffd60a;
      --radius:14px;--radius-sm:8px;
    }
    [data-theme=light]{
      --bg:#f5f5f7;--surface:#ffffff;--surface2:#e5e5ea;
      --text:#1c1c1e;--text2:#6e6e73;--accent:#007aff;
      --danger:#ff3b30;--success:#28cd41;--warning:#ffcc00;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
      background:var(--bg);color:var(--text);min-height:100dvh;
      padding-bottom:env(safe-area-inset-bottom)}
    .screen{display:none;min-height:100dvh;flex-direction:column}
    .screen.active{display:flex}
    .topbar{display:flex;align-items:center;justify-content:space-between;
      padding:16px 20px 8px;padding-top:calc(16px + env(safe-area-inset-top))}
    .topbar h1{font-size:1.1rem;font-weight:700;letter-spacing:-.3px}
    .content{flex:1;overflow-y:auto;padding:0 20px 20px}
    .btn{display:block;width:100%;padding:14px;border:none;border-radius:var(--radius-sm);
      font-size:1rem;font-weight:600;cursor:pointer;transition:opacity .15s}
    .btn:active{opacity:.7}
    .btn-primary{background:var(--accent);color:#fff}
    .btn-secondary{background:var(--surface2);color:var(--text)}
    .btn-danger{background:var(--danger);color:#fff}
    .btn-ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
    .input{width:100%;padding:12px 14px;background:var(--surface2);border:none;
      border-radius:var(--radius-sm);color:var(--text);font-size:1rem}
    .input::placeholder{color:var(--text2)}
    textarea.input{font-family:inherit}
    .card{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:12px}
    .toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;
      transform:translateX(-50%) translateY(20px);background:var(--surface2);
      color:var(--text);padding:10px 20px;border-radius:40px;font-size:.9rem;
      opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:999;white-space:nowrap}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .tab-bar{display:flex;background:var(--surface);border-top:1px solid var(--surface2);
      padding-bottom:env(safe-area-inset-bottom);position:sticky;bottom:0}
    .tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;
      padding:10px 0;background:none;border:none;color:var(--text2);font-size:.65rem;
      cursor:pointer;gap:3px;position:relative}
    .tab-btn.active{color:var(--accent)}
    .tab-btn svg{width:22px;height:22px}
    .tab-badge{position:absolute;top:6px;right:calc(50% - 18px);background:var(--danger);
      color:#fff;font-size:.6rem;font-weight:700;min-width:16px;height:16px;
      border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px}
    .section-title{font-size:.75rem;font-weight:600;color:var(--text2);text-transform:uppercase;
      letter-spacing:.5px;margin:20px 0 10px}
    .spinner{width:36px;height:36px;border:3px solid var(--surface2);
      border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
    @keyframes spin{to{transform:rotate(360deg)}}
    /* auth */
    .auth-wrap{display:flex;flex-direction:column;justify-content:center;
      min-height:100dvh;padding:40px 24px;gap:16px}
    .auth-title{font-size:2rem;font-weight:800;text-align:center;margin-bottom:8px}
    .auth-sub{font-size:.95rem;color:var(--text2);text-align:center;margin-bottom:8px}
    /* profile */
    .profile-header{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px}
    .profile-avatar{width:72px;height:72px;border-radius:50%;background:var(--accent);
      display:flex;align-items:center;justify-content:center;font-size:2rem;flex-shrink:0}
    .profile-name{font-size:1.1rem;font-weight:700}
    .profile-bio{font-size:.85rem;color:var(--text2);margin-top:2px}
    /* record */
    .rec-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;
      flex:1;gap:24px;padding:40px 0}
    .rec-btn{width:96px;height:96px;border-radius:50%;border:none;cursor:pointer;
      background:var(--accent);display:flex;align-items:center;justify-content:center;
      transition:transform .15s,opacity .15s;flex-shrink:0}
    .rec-btn:active{transform:scale(.93)}
    .rec-btn.recording{background:var(--danger)}
    .rec-btn svg{width:40px;height:40px;fill:#fff}
    .rec-time{font-size:1.5rem;font-weight:700;letter-spacing:2px}
    .rec-caption{width:100%}
    .rec-caption-wrap{position:relative;width:100%}
    .rec-caption-counter{position:absolute;right:10px;bottom:8px;font-size:.72rem;color:var(--text2);pointer-events:none}
    .preview-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;padding:0 20px}
    /* feed */
    .feed-card{background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:10px}
    .feed-card.greyed{opacity:.72}
    .feed-meta{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .feed-avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);
      display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
    .feed-name{font-weight:600;font-size:.95rem;cursor:pointer}
    .feed-name:hover{text-decoration:underline}
    .feed-time{font-size:.75rem;color:var(--text2)}
    .feed-bio{font-size:.75rem;color:var(--text2);margin-top:1px}
    .feed-tag{font-size:.7rem;background:var(--surface2);color:var(--text2);
      border-radius:4px;padding:2px 6px;display:inline-block;margin-bottom:6px}
    .feed-caption{font-size:.9rem;margin-bottom:10px}
    .waveform{display:flex;align-items:center;gap:2px;height:40px;margin-bottom:10px;cursor:pointer}
    .waveform-bar{flex:1;background:var(--surface2);border-radius:2px;transition:background .15s}
    .waveform-bar.played{background:var(--accent)}
    .feed-actions{display:flex;gap:8px;align-items:center}
    .action-btn{background:var(--surface2);border:none;border-radius:var(--radius-sm);
      padding:6px 12px;color:var(--text);font-size:.8rem;cursor:pointer;display:flex;
      align-items:center;gap:4px}
    .action-btn:active{opacity:.7}
    .action-btn.reacted{background:var(--accent);color:#fff}
    .action-btn.bookmarked{background:var(--warning);color:#111}
    .speed-btn{background:var(--surface2);border:none;border-radius:var(--radius-sm);
      padding:6px 10px;color:var(--text2);font-size:.75rem;cursor:pointer;font-weight:600}
    .speed-btn.active{color:var(--accent)}
    .duration-label{font-size:.72rem;color:var(--text2);margin-left:auto}
    /* comments */
    .comments-section{margin-top:8px;border-top:1px solid var(--surface2);padding-top:8px}
    .comment-item{display:flex;align-items:flex-start;gap:6px;margin-bottom:6px;font-size:.82rem}
    .comment-author{font-weight:600;flex-shrink:0}
    .comment-text{color:var(--text2)}
    .comment-time{font-size:.7rem;color:var(--text2);flex-shrink:0;margin-left:auto}
    .comment-del{background:none;border:none;color:var(--text2);cursor:pointer;font-size:.8rem;padding:0 2px}
    .comment-form{display:flex;gap:6px;margin-top:6px}
    .comment-input{flex:1;padding:6px 10px;background:var(--surface2);border:none;
      border-radius:var(--radius-sm);color:var(--text);font-size:.82rem}
    .comment-submit{background:var(--accent);border:none;border-radius:var(--radius-sm);
      padding:6px 12px;color:#fff;font-size:.82rem;cursor:pointer}
    /* filters */
    .filter-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
    .filter-row::-webkit-scrollbar{display:none}
    .filter-chip{flex-shrink:0;padding:5px 12px;border-radius:20px;border:1px solid var(--surface2);
      background:var(--surface);color:var(--text2);font-size:.78rem;cursor:pointer}
    .filter-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
    .caption-search{width:100%;padding:7px 12px;border:1px solid var(--surface2);border-radius:20px;
      background:var(--surface);color:var(--text);font-size:.85rem;margin-bottom:12px;
      box-sizing:border-box;outline:none}
    .caption-search:focus{border-color:var(--accent)}
    /* streaks */
    .streak-banner{background:linear-gradient(135deg,var(--accent),#5e5ce6);
      border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;display:flex;
      align-items:center;gap:10px}
    .streak-text{font-weight:700;font-size:1rem}
    /* calendar */
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
    .cal-cell{aspect-ratio:1;border-radius:4px;background:var(--surface2);
      display:flex;align-items:center;justify-content:center;font-size:.65rem;color:var(--text2)}
    .cal-cell.posted{background:var(--accent);color:#fff;cursor:pointer}
    .cal-cell.posted:hover{opacity:.85}
    .cal-cell.header{background:transparent;font-weight:600}
    /* modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;
      display:flex;align-items:flex-end;justify-content:center}
    .modal-sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;
      max-width:480px;padding:24px 20px;padding-bottom:calc(24px + env(safe-area-inset-bottom));
      max-height:85dvh;overflow-y:auto}
    .modal-handle{width:40px;height:4px;background:var(--surface2);border-radius:2px;
      margin:0 auto 16px}
    /* new-posts banner */
    .new-posts-banner{position:sticky;top:0;z-index:10;background:var(--accent);
      color:#fff;text-align:center;padding:8px 16px;font-size:.85rem;font-weight:600;
      cursor:pointer;border-radius:var(--radius-sm);margin-bottom:8px}
    /* onboarding */
    .onb-step{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
    .onb-num{width:28px;height:28px;border-radius:50%;background:var(--accent);
      color:#fff;font-weight:700;font-size:.9rem;display:flex;align-items:center;
      justify-content:center;flex-shrink:0}
    /* inline-edit */
    .inline-edit-wrap{display:flex;align-items:center;gap:6px}
    .inline-edit-input{flex:1;padding:4px 8px;background:var(--surface2);border:none;
      border-radius:var(--radius-sm);color:var(--text);font-size:.95rem}
    .inline-edit-save{background:var(--accent);border:none;border-radius:var(--radius-sm);
      padding:4px 10px;color:#fff;font-size:.82rem;cursor:pointer}
    .inline-edit-cancel{background:var(--surface2);border:none;border-radius:var(--radius-sm);
      padding:4px 10px;color:var(--text2);font-size:.82rem;cursor:pointer}
  </style>
</head>
<body>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- Auth Screen -->
<div id="screenAuth" class="screen">
  <div class="auth-wrap">
    <div class="auth-title">コエリアル</div>
    <p class="auth-sub">声のBeReal</p>
    <input id="inputEmail" class="input" type="email" placeholder="メールアドレス" autocomplete="email" aria-label="メールアドレス">
    <input id="inputPassword" class="input" type="password" placeholder="パスワード" autocomplete="current-password" aria-label="パスワード">
    <button class="btn btn-primary" id="btnLogin">ログイン</button>
    <button class="btn btn-secondary" id="btnSignup">新規登録</button>
    <button class="btn btn-ghost" id="btnForgotPw" style="margin-top:4px;font-size:.9rem">パスワードを忘れた場合</button>
  </div>
</div>

<!-- Reset Password Screen -->
<div id="screenReset" class="screen">
  <div class="auth-wrap">
    <div class="auth-title" style="font-size:1.4rem">パスワードリセット</div>
    <p class="auth-sub">登録したメールアドレスにリセットリンクを送信します</p>
    <input id="inputResetEmail" class="input" type="email" placeholder="メールアドレス" autocomplete="email" aria-label="メールアドレス">
    <button class="btn btn-primary" id="btnSendReset">リセットメールを送信</button>
    <button class="btn btn-ghost" id="btnBackToLogin">ログインに戻る</button>
  </div>
</div>

<!-- Onboarding Screen -->
<div id="screenOnboarding" class="screen">
  <div style="display:flex;flex-direction:column;min-height:100dvh;padding:env(safe-area-inset-top) 0 0">
    <div class="topbar"><h1>はじめに</h1></div>
    <div class="content" style="display:flex;flex-direction:column;gap:0">
      <p style="font-size:.95rem;color:var(--text2);margin-bottom:24px">コエリアルをホーム画面に追加して、通知を受け取る設定をしましょう。</p>
      <div id="onbSteps"></div>
      <button class="btn btn-primary" id="btnOnbDone" style="margin-top:8px">はじめる</button>
      <button class="btn btn-ghost" id="btnOnbSkip" style="margin-top:8px">スキップ</button>
    </div>
  </div>
</div>

<!-- Main App -->
<div id="screenApp" class="screen">
  <div style="display:flex;flex-direction:column;min-height:100dvh">

    <!-- Feed Tab -->
    <div id="tabFeed" class="tab-content" style="display:flex;flex-direction:column;flex:1;overflow:hidden">
      <div class="topbar">
        <h1>コエリアル</h1>
        <div style="display:flex;gap:8px;align-items:center">
          <span id="todayTimeDisplay" style="font-size:.78rem;color:var(--text2)"></span>
          <button id="btnPlayAll" style="background:var(--surface2);border:none;border-radius:var(--radius-sm);padding:6px 10px;color:var(--text);font-size:.78rem;cursor:pointer;white-space:nowrap">全部聴く</button>
          <button id="btnRefreshFeed" style="background:var(--surface2);border:none;border-radius:var(--radius-sm);padding:6px 10px;color:var(--text);font-size:.78rem;cursor:pointer">更新</button>
        </div>
      </div>
      <div class="content" id="feedContent" style="flex:1;overflow-y:auto">
        <div class="spinner"></div>
      </div>
    </div>

    <!-- Record Tab -->
    <div id="tabRecord" class="tab-content" style="display:none;flex-direction:column;flex:1">
      <div class="topbar"><h1>声を残す</h1></div>
      <div class="content" style="display:flex;flex-direction:column;flex:1">
        <div id="recScreen" class="rec-wrap">
          <div id="tagPicker" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"></div>
          <div id="vizWrap" style="display:flex;align-items:center;gap:3px;height:48px;width:100%"></div>
          <div class="rec-caption-wrap" style="width:100%;max-width:340px">
            <textarea id="recCaption" class="input rec-caption" placeholder="ひとこと(任意・50文字以内)" maxlength="50" rows="2" style="resize:none" aria-label="キャプション"></textarea>
            <span id="recCaptionCount" class="rec-caption-counter">50</span>
          </div>
          <div id="durationPicker" style="display:flex;gap:8px;justify-content:center;margin:4px 0" aria-label="録音最大時間"></div>
          <button id="btnRecord" class="rec-btn" aria-label="録音開始">
            <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.49 6-3.31 6-6.72h-1.7z"/></svg>
          </button>
          <div id="recTimer" class="rec-time" aria-live="polite">00:00</div>
        </div>
        <div id="previewScreen" class="rec-wrap" style="display:none">
          <div class="preview-wrap">
            <p style="font-size:1rem;font-weight:600;text-align:center">この声で投稿しますか？</p>
            <audio id="previewAudio" controls style="width:100%;margin:8px 0"></audio>
            <button class="btn btn-primary" id="btnSubmitPost">この声で投稿する</button>
            <button class="btn btn-secondary" id="btnRetake" style="margin-top:8px">撮り直す</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Profile Tab -->
    <div id="tabProfile" class="tab-content" style="display:none;flex-direction:column;flex:1">
      <div class="topbar"><h1>プロフィール</h1>
        <div style="display:flex;gap:8px">
          <button id="btnThemeToggle" style="background:none;border:none;color:var(--text2);cursor:pointer;font-size:1.1rem" aria-label="テーマ切替">◑</button>
          <button id="btnLogout" style="background:none;border:none;color:var(--text2);cursor:pointer;font-size:.85rem">ログアウト</button>
        </div>
      </div>
      <div class="content">
        <div class="profile-header">
          <div class="profile-avatar" id="profileAvatar"></div>
          <div style="flex:1;min-width:0">
            <div id="nameDisplay" style="display:flex;align-items:center;gap:6px">
              <span class="profile-name" id="profileName"></span>
              <button id="nameEditBtn" class="btn btn-ghost" style="width:auto;padding:2px 8px;font-size:.72rem;flex-shrink:0" aria-label="表示名を編集">編集</button>
            </div>
            <div id="nameEditArea" style="display:none;margin-top:4px">
              <div class="inline-edit-wrap">
                <input id="nameEditInput" class="inline-edit-input" type="text" maxlength="30" aria-label="表示名">
                <button id="nameEditSave" class="inline-edit-save">保存</button>
                <button id="nameEditCancel" class="inline-edit-cancel">ｷｬﾝｾﾙ</button>
              </div>
            </div>
      <div id="bioDisplay" style="display:flex;align-items:center;gap:6px;margin-top:2px">
        <p class="profile-bio" id="profileBio"></p>
        <button id="bioEditBtn" class="btn btn-ghost" style="width:auto;padding:2px 8px;font-size:.72rem;flex-shrink:0" aria-label="ひとことを編集">編集</button>
      </div>
      <div id="bioEditArea" style="display:none;margin-top:4px">
        <textarea id="inputBio" placeholder="ひとこと(40文字以内)" maxlength="40" rows="2" style="resize:none;margin-bottom:6px" aria-label="ひとこと"></textarea>
        <div style="display:flex;gap:6px">
          <button id="bioEditSave" class="btn btn-primary" style="flex:1;padding:6px 0;font-size:.85rem">保存</button>
          <button id="bioEditCancel" class="btn btn-ghost" style="flex:1;padding:6px 0;font-size:.85rem">キャンセル</button>
        </div>
      </div>
    </div>
  </div>
        </div>
        <p class="section-title">フレンドコード</p>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
          <code id="myFriendCode" style="font-size:1.3rem;font-weight:700;letter-spacing:2px"></code>
          <button id="btnCopyInvite" class="btn btn-ghost" style="width:auto;padding:6px 14px;font-size:.85rem">招待テキストをコピー</button>
        </div>
        <p class="section-title">フレンドを追加</p>
        <div style="display:flex;gap:8px;margin-bottom:20px">
          <input id="inputFriendCode" class="input" placeholder="フレンドコードを入力" style="flex:1" aria-label="フレンドコード">
          <button id="btnAddFriend" class="btn btn-primary" style="width:auto;padding:0 16px">追加</button>
        </div>
        <p class="section-title">通知設定</p>
        <div style="display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px">
          <span style="font-size:.9rem">毎日の通知を受け取る</span>
          <button id="btnNotifToggle" role="switch" style="background:var(--surface2);border:none;border-radius:20px;padding:4px 12px;color:var(--text2);font-size:.8rem;cursor:pointer" aria-checked="false">オフ</button>
        </div>
        <p class="section-title">プロフィールを再表示</p>
        <button id="btnShowOnboarding" class="btn btn-secondary" style="margin-bottom:20px">ホーム画面追加ガイドを見る</button>
        <p class="section-title">統計</p>
        <div id="profileStats" style="display:flex;gap:12px;margin-bottom:20px">
          <div style="flex:1;background:var(--surface);border-radius:var(--radius-sm);padding:12px;text-align:center">
            <div id="statTotalPosts" style="font-size:1.5rem;font-weight:700">-</div>
            <div style="font-size:.75rem;color:var(--text2)">合計投稿</div>
          </div>
          <div style="flex:1;background:var(--surface);border-radius:var(--radius-sm);padding:12px;text-align:center">
            <div id="statMaxStreak" style="font-size:1.5rem;font-weight:700">-</div>
            <div style="font-size:.75rem;color:var(--text2)">最長連続</div>

const VAPID_PUBLIC='BDqaGnS8fqxEA2GknxnxVJsJvl7NxdkMiEOhT3n-OIqAUWCLdE6bPq7VXKV5SklLRGANIFGvEzIe_8ZGTzevtYo';
async function subscribeWebPush(){
  if(!('serviceWorker' in navigator)) return;
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub){
      sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC)});
    }
    const subJson=sub.toJSON();
    await sb.from('subscriptions').upsert({user_id:me.id,endpoint:subJson.endpoint,p256dh:subJson.keys.p256dh,auth:subJson.keys.auth,is_active:true},{onConflict:'user_id,endpoint'});
    await updateNotifToggle();
  } catch(e){ console.warn('push sub error',e); }
}
function urlBase64ToUint8Array(b64){
  const pad='='.repeat((4-b64.length%4)%4);
  const b=atob((b64+pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from(b,c=>c.charCodeAt(0));
}
async function updateNotifToggle(){
  const reg=await navigator.serviceWorker.ready.catch(()=>null);
  if(!reg) return;
  const sub=await reg.pushManager.getSubscription().catch(()=>null);
  if(!sub){$('btnNotifToggle').textContent='オフ';$('btnNotifToggle').setAttribute('aria-checked','false');return;}
  const{data}=await sb.from('subscriptions').select('is_active').eq('user_id',me.id).eq('endpoint',sub.endpoint).single();

  $('btnNotifToggle').textContent=active?'オン':'オフ';

}

// today time display
function getTodayPostTime(){
  const now=new Date();
  const seed=now.getFullYear()*10000+(now.getMonth()+1)*100+now.getDate();
  const hash=((seed*1103515245+12345)&0x7fffffff);
  const minutesFrom11=(hash%(10*60));
  const totalMinutes=11*60+minutesFrom11;
  const h=Math.floor(totalMinutes/60);
  const m=totalMinutes%60;
  return{h,m};
}
function updateTodayTimeDisplay(){
  const{h,m}=getTodayPostTime();
  $('todayTimeDisplay').textContent=`本日 ${h}:${String(m).padStart(2,'0')}`;
}
updateTodayTimeDisplay();

function isOnTime(createdAt){
  const d=new Date(createdAt);
  const{h,m}=getTodayPostTime();
  const postDate=new Date(d);
  const schedH=h;const schedM=m;
  const ref=new Date(postDate.getFullYear(),postDate.getMonth(),postDate.getDate(),schedH,schedM,0);
  const diff=(d-ref)/60000;
  return diff>=0&&diff<=60;
}

// record
$('btnRecord').addEventListener('click',async()=>{
  if(mediaRecorder&&mediaRecorder.state==='recording'){
    mediaRecorder.stop();
  } else {
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      audioChunks=[];
      const AudioContext=window.AudioContext||window.webkitAudioContext;
      const actx=new AudioContext();
      const src=actx.createMediaStreamSource(stream);
      const analyser=actx.createAnalyser();
      analyser.fftSize=64;
      src.connect(analyser);
      const vizWrap=$('vizWrap');
      vizWrap.innerHTML='';
      const bars=[];
      for(let i=0;i<16;i++){const b=document.createElement('div');b.style.cssText='flex:1;border-radius:3px;background:var(--accent);min-height:4px';vizWrap.appendChild(b);bars.push(b);}
      const bufLen=analyser.frequencyBinCount;
      const dataArr=new Uint8Array(bufLen);
      let vizRaf;
      function drawViz(){
        vizRaf=requestAnimationFrame(drawViz);
        analyser.getByteFrequencyData(dataArr);
        bars.forEach((b,i)=>{
          const val=dataArr[Math.floor(i*bufLen/bars.length)]/255;
          b.style.height=(6+val*42)+'px';
        });
      }
      drawViz();
      mediaRecorder=new MediaRecorder(stream);
      mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
      mediaRecorder.onstop=()=>{
        $('durationPicker').querySelectorAll('.dur-chip').forEach(b=>b.disabled=false);
        cancelAnimationFrame(vizRaf);
        actx.close();
        stream.getTracks().forEach(t=>t.stop());
        vizWrap.innerHTML='';
        const blob=new Blob(audioChunks,{type:'audio/webm'});
        pendingBlob=blob;
        pendingCaption=$('recCaption').value.trim();
        const url=URL.createObjectURL(blob);
        $('previewAudio').src=url;
        $('recScreen').style.display='none';
        $('previewScreen').style.display='flex';
      };
      mediaRecorder.start();
      $('durationPicker').querySelectorAll('.dur-chip').forEach(b=>b.disabled=true);
      $('btnRecord').classList.add('recording');
      $('btnRecord').innerHTML='<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12"/></svg>';
      $('btnRecord').setAttribute('aria-label','録音停止');
      recSeconds=0;
      $('recTimer').textContent='00:00';
      recInterval=setInterval(()=>{
        recSeconds++;
        const m=String(Math.floor(recSeconds/60)).padStart(2,'0');
        const s=String(recSeconds%60).padStart(2,'0');
        $('recTimer').textContent=`${m}:${s}`;
        if(recSeconds>=maxRecSec){mediaRecorder.stop();clearInterval(recInterval);}
      },1000);
    } catch(e){ showToast('マイクのアクセスを許可してください'); }
  }
});

async function pollNewPosts(){
  const today=new Date().toISOString().split('T')[0];
  const{data:fresh}=await sb.from('friend_feed').select('*').eq('post_date',today).order('created_at',{ascending:false});
  if(!fresh) return;
  const freshIds=new Set(fresh.map(p=>p.id));
  const newOnes=[...freshIds].filter(id=>!lastFeedIds.has(id));
  if(newOnes.length>0){
    lastFeedIds=freshIds;
    feedPosts=fresh;
    const existing=$('feedContent').querySelector('.new-posts-banner');
    if(existing) existing.remove();
    const banner=document.createElement('div');
    banner.className='new-posts-banner';
    banner.textContent=`フレンドの新しい声が${newOnes.length}件とどいたよ 更新する`;
    banner.addEventListener('click',()=>loadFeed());
    $('feedContent').prepend(banner);
  }
}

function renderFeed(el,posts,myPost,yesterdayPosts){
  el.innerHTML='';
  const streak=calcCurrentStreak();
  if(streak>=3){
    const b=document.createElement('div');
    b.className='streak-banner';
    b.innerHTML=`<span style="font-size:1.3rem">*</span><span class="streak-text">${streak}日連続！すごい！</span>`;
    el.appendChild(b);
  }
  // week progress bar
  {
    const weekDays=[];
    for(let i=6;i>=0;i--){
      const d=new Date();
      d.setDate(d.getDate()-i);
      weekDays.push(d.toISOString().split('T')[0]);
    }
    const weekPosted=weekDays.filter(d=>myPostDates.includes(d)).length;
    const weekBar=document.createElement('div');
    weekBar.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:8px 12px;background:var(--surface1);border-radius:8px';
    const wLabel=document.createElement('span');
    wLabel.style.cssText='font-size:.78rem;color:var(--text2);white-space:nowrap';
    wLabel.textContent='今週';
    const dotsWrap=document.createElement('div');
    dotsWrap.style.cssText='display:flex;gap:4px;flex:1';
    weekDays.forEach(d=>{
      const dot=document.createElement('div');
      dot.style.cssText='width:10px;height:10px;border-radius:50%;flex-shrink:0;background:'+(myPostDates.includes(d)?'var(--accent)':'var(--surface2)');
      dotsWrap.appendChild(dot);
    });
    const wCount=document.createElement('span');
    wCount.style.cssText='font-size:.78rem;color:var(--text2);white-space:nowrap';
    wCount.textContent=weekPosted+'/7';
    weekBar.appendChild(wLabel);
    weekBar.appendChild(dotsWrap);
    weekBar.appendChild(wCount);
    el.appendChild(weekBar);
  }
  // filter row
  const allTags=[...new Set((posts||[]).map(p=>p.tag).filter(Boolean))];
  const filterRow=document.createElement('div');
  filterRow.className='filter-row';
  if(allTags.length>0){
    const chips=[{tag:'',label:'全て'},...allTags.map(t=>({tag:t,label:t}))];
    filterRow.innerHTML=chips.map(c=>`<button class="filter-chip${c.tag===activeTagFilter?' active':''}" data-tag="${c.tag}">${c.label}</button>`).join('');
    filterRow.querySelectorAll('.filter-chip').forEach(b=>b.addEventListener('click',()=>{
      activeTagFilter=b.dataset.tag;
      renderFeed(el,posts,myPost,yesterdayPosts);
    }));
    el.appendChild(filterRow);
  }
  // unheard filter
  const unheardBtn=document.createElement('button');
  unheardBtn.className='filter-chip'+(showUnheardOnly?' active':'');
  unheardBtn.textContent='未聴のみ';
  unheardBtn.style.marginBottom='12px';
  unheardBtn.addEventListener('click',()=>{showUnheardOnly=!showUnheardOnly;renderFeed(el,posts,myPost,yesterdayPosts);});
  el.appendChild(unheardBtn);
  // caption search
  const searchInput=document.createElement('input');
  searchInput.type='text';
  searchInput.className='caption-search';
  searchInput.placeholder='キャプションで絞り込む';
  searchInput.setAttribute('aria-label','キャプションで絞り込む');
  searchInput.value=captionSearchQuery;
  searchInput.addEventListener('input',()=>{
    captionSearchQuery=searchInput.value;
    renderFeed(el,posts,myPost,yesterdayPosts);
  });
  el.appendChild(searchInput);
  if(captionSearchQuery){
    requestAnimationFrame(()=>{
      searchInput.focus();
      searchInput.setSelectionRange(captionSearchQuery.length,captionSearchQuery.length);
    });
  }
  // my post
  const mySection=document.createElement('div');
  mySection.innerHTML='<p class="section-title">きょうの自分の声</p>';
  if(myPost){
    mySection.appendChild(buildMyCard(myPost));
  } else {
    mySection.innerHTML+='<p style="color:var(--text2);font-size:.9rem">まだ声を残していません</p>';
  }
  el.appendChild(mySection);
  // friends
  const friendSection=document.createElement('div');
  let filteredPosts=posts||[];
  if(activeTagFilter) filteredPosts=filteredPosts.filter(p=>p.tag===activeTagFilter);
  if(showUnheardOnly){
    const played=getPlayedSet();
    filteredPosts=filteredPosts.filter(p=>!played.has(p.id)&&!p.reacted_by_me);
  }
  if(captionSearchQuery){
    const q=captionSearchQuery.toLowerCase();
    filteredPosts=filteredPosts.filter(p=>(p.caption||'').toLowerCase().includes(q));
  }
  const hasFriendPosts=filteredPosts.length>0;
  friendSection.innerHTML=`<p class="section-title">フレンドの声</p>`;
  // not-posted friends
  const{data:friendData}=await sb.from('friendships').select('friend_id').eq('user_id',me.id);
  // async workaround — build not-yet-posted list
  (async()=>{
    if(!friendData) return;
    const postedIds=new Set((posts||[]).map(p=>p.user_id));
    const notPosted=friendData.map(f=>f.friend_id).filter(id=>!postedIds.has(id));
    if(notPosted.length>0){
      const{data:notProfiles}=await sb.from('profiles').select('username').in('id',notPosted);
      if(notProfiles&&notProfiles.length>0){
        const names=notProfiles.map(p=>p.username).join('、');
        const np=document.createElement('p');
        np.style.cssText='font-size:.78rem;color:var(--text2);margin-bottom:8px';
        np.textContent=`まだ声がないよ: ${names}`;
        friendSection.insertBefore(np,friendSection.querySelector('.feed-card')||null);
      }
    }
  })();
  if(hasFriendPosts){
    filteredPosts.forEach(post=>friendSection.appendChild(buildFeedCard(post)));
  } else {
    friendSection.innerHTML+='<p style="color:var(--text2);font-size:.9rem">フレンドの投稿はまだありません</p>';
  }
  el.appendChild(friendSection);
  // yesterday section
  const ySection=document.createElement('details');
  ySection.style.marginTop='16px';
  const ySum=document.createElement('summary');
  ySum.className='section-title';
  ySum.style.cursor='pointer';
  ySum.textContent='昨日の声';
  ySection.appendChild(ySum);
  if(yesterdayPosts&&yesterdayPosts.length>0){
    yesterdayPosts.forEach(p=>ySection.appendChild(buildFeedCard(p)));
  } else {
    const yEmpty=document.createElement('p');
    yEmpty.style.cssText='color:var(--text2);font-size:.9rem;padding:8px 0';
    yEmpty.textContent='昨日のフレンドの声はありません';
    ySection.appendChild(yEmpty);
  }
  el.appendChild(ySection);
}

function buildMyCard(post){
  const card=document.createElement('div');
  card.className='card';
  let editMode=false;
  const captionEl=document.createElement('p');
  captionEl.style.cssText='font-size:.9rem;margin-bottom:8px';
  captionEl.textContent=post.caption||'';
  card.appendChild(captionEl);
  const actRow=document.createElement('div');
  actRow.style.cssText='display:flex;gap:8px;flex-wrap:wrap';
  const editBtn=document.createElement('button');
  editBtn.className='action-btn';
  editBtn.textContent='編集';
  const delBtn=document.createElement('button');
  delBtn.className='action-btn';
  delBtn.style.color='var(--danger)';
  delBtn.textContent='削除';
  actRow.appendChild(editBtn);
  actRow.appendChild(delBtn);
  card.appendChild(actRow);
  const editWrap=document.createElement('div');
  editWrap.style.display='none';
  const editInput=document.createElement('input');
  editInput.type='text';
  editInput.className='input';
  editInput.maxLength=50;
  editInput.value=post.caption||'';
  editInput.style.marginBottom='6px';
  const saveBtn=document.createElement('button');
  saveBtn.className='btn btn-primary';
  saveBtn.textContent='保存';
  saveBtn.style.cssText='padding:6px;font-size:.85rem;margin-bottom:4px';
  const cancelBtn=document.createElement('button');
  cancelBtn.className='btn btn-ghost';
  cancelBtn.textContent='キャンセル';
  cancelBtn.style.cssText='padding:6px;font-size:.85rem';
  editWrap.appendChild(editInput);
  editWrap.appendChild(saveBtn);
  editWrap.appendChild(cancelBtn);
  card.insertBefore(editWrap,actRow);
  editBtn.addEventListener('click',()=>{
    editMode=true;
    captionEl.style.display='none';
    editWrap.style.display='';
    editInput.focus();
  });
  cancelBtn.addEventListener('click',()=>{
    editMode=false;
    editWrap.style.display='none';
    captionEl.style.display='';
  });
  saveBtn.addEventListener('click',async()=>{
    const newCap=editInput.value.trim();
    const{error}=await sb.from('posts').update({caption:newCap}).eq('id',post.id);
    if(error){showToast('保存失敗: '+error.message);return;}
    post.caption=newCap;
    captionEl.textContent=newCap;
    editWrap.style.display='none';
    captionEl.style.display='';
    showToast('キャプションを保存しました');
  });
  delBtn.addEventListener('click',async()=>{
    if(!confirm('この投稿を削除しますか？')) return;
    const today=new Date().toISOString().split('T')[0];
    await sb.storage.from('voice-posts').remove([`${me.id}/${today}.webm`]);
    const{error}=await sb.from('posts').delete().eq('id',post.id);
    if(error){showToast('削除失敗: '+error.message);return;}
    showToast('投稿を削除しました');
    loadFeed();
  });
  return card;
}

async function loadReactions(postIds){
  if(!postIds.length) return{};
  const{data}=await sb.from('reactions').select('post_id,user_id').in('post_id',postIds);
  const map={};
  (data||[]).forEach(r=>{
    if(!map[r.post_id]) map[r.post_id]={count:0,reacted:false};
    map[r.post_id].count++;
    if(r.user_id===me.id) map[r.post_id].reacted=true;
  });
  return map;
}
async function loadCommentCounts(postIds){
  if(!postIds.length) return{};
  const{data}=await sb.from('comments').select('post_id').in('post_id',postIds);
  const map={};
  (data||[]).forEach(c=>{map[c.post_id]=(map[c.post_id]||0)+1;});
  return map;
}

function buildFeedCard(post){
  const card=document.createElement('div');
  card.className='feed-card';
  const played=getPlayedSet();
  if(played.has(post.id)||post.reacted_by_me) card.classList.add('greyed');
  const meta=document.createElement('div');
  meta.className='feed-meta';
  const avatar=document.createElement('div');
  avatar.className='feed-avatar';
  avatar.textContent=(post.username||'?')[0].toUpperCase();
  const nameWrap=document.createElement('div');
  nameWrap.style.flex='1';
  const nameEl=document.createElement('div');
  nameEl.className='feed-name';
  nameEl.textContent=post.username||'?';
  nameEl.addEventListener('click',()=>showMiniProfile(post.user_id));
  const timeEl=document.createElement('div');
  timeEl.className='feed-time';
  const d=new Date(post.created_at);
  timeEl.textContent=`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  if(isOnTime(post.created_at)){
    const badge=document.createElement('span');
    badge.style.cssText='background:var(--warning);color:#111;font-size:.65rem;font-weight:700;padding:1px 5px;border-radius:4px;margin-left:4px';
    badge.textContent='時間内';
    timeEl.appendChild(badge);
  }
  const bioEl=document.createElement('div');
  bioEl.className='feed-bio';
  bioEl.textContent=post.bio||'';
  nameWrap.appendChild(nameEl);
  nameWrap.appendChild(timeEl);
  nameWrap.appendChild(bioEl);
  meta.appendChild(avatar);
  meta.appendChild(nameWrap);
  card.appendChild(meta);
  if(post.tag){
    const tagEl=document.createElement('div');
    tagEl.className='feed-tag';
    tagEl.textContent=post.tag;
    card.appendChild(tagEl);
  }
  if(post.caption){
    const capEl=document.createElement('div');
    capEl.className='feed-caption';
    capEl.textContent=post.caption;
    card.appendChild(capEl);
  }
  // waveform
  const wf=document.createElement('div');
  wf.className='waveform';
  wf.setAttribute('role','button');
  wf.setAttribute('aria-label','再生');
  const BAR_COUNT=24;
  const bars=[];
  for(let i=0;i<BAR_COUNT;i++){
    const b=document.createElement('div');
    b.className='waveform-bar';
    const h=10+Math.sin(i*0.8+post.id?.charCodeAt(0)||0)*6+Math.random()*14;
    b.style.height=h+'px';
    wf.appendChild(b);
    bars.push(b);
  }
  let audio=null;
  let isLoaded=false;
  const durationLabel=document.createElement('span');
  durationLabel.className='duration-label';
  {
    const today=new Date().toISOString().split('T')[0];
    const pdate=post.post_date||today;
    const{data:metaUrl}=sb.storage.from('voice-posts').getPublicUrl(`${post.user_id}/${pdate}.webm`);
    const metaAudio=new Audio();
    metaAudio.preload='metadata';
    metaAudio.src=metaUrl.publicUrl;
    metaAudio.addEventListener('loadedmetadata',()=>{
      durationLabel.textContent=Math.round(metaAudio.duration)+'秒';
    },{once:true});
  }
  const actionsRow=document.createElement('div');
  actionsRow.className='feed-actions';
  const speedBtn=document.createElement('button');
  speedBtn.className='speed-btn';
  let currentSpeedIdx=SPEED_OPTIONS.indexOf(savedSpeed);
  if(currentSpeedIdx<0) currentSpeedIdx=1;
  speedBtn.textContent=`x${SPEED_OPTIONS[currentSpeedIdx]}`;
  speedBtn.addEventListener('click',()=>{
    currentSpeedIdx=(currentSpeedIdx+1)%SPEED_OPTIONS.length;
    const sp=SPEED_OPTIONS[currentSpeedIdx];
    speedBtn.textContent=`x${sp}`;
    savedSpeed=sp;
    localStorage.setItem('playSpeed',sp);
    if(audio) audio.playbackRate=sp;
  });
  const reactBtn=document.createElement('button');
  reactBtn.className='action-btn';
  reactBtn.setAttribute('aria-label','聴いたよ');
  reactBtn.textContent='聴いたよ';
  const bmBtn=document.createElement('button');
  bmBtn.className='action-btn';
  bmBtn.setAttribute('aria-label','ブックマーク');
  bmBtn.textContent='保存';
  actionsRow.appendChild(speedBtn);
  actionsRow.appendChild(durationLabel);
  actionsRow.appendChild(reactBtn);
  actionsRow.appendChild(bmBtn);
  // comment count btn
  const commentCountBtn=document.createElement('button');
  commentCountBtn.className='action-btn';
  commentCountBtn.setAttribute('aria-label','コメント');
  commentCountBtn.textContent='コメント -件';
  actionsRow.appendChild(commentCountBtn);
  // async load reaction + comment counts
  (async()=>{
    const rmap=await loadReactions([post.id]);
    const cmap=await loadCommentCounts([post.id]);
    const ri=rmap[post.id]||{count:0,reacted:false};
    reactBtn.textContent=`聴いたよ ${ri.count}`;
    if(ri.reacted) reactBtn.classList.add('reacted');
    commentCountBtn.textContent=`コメント ${cmap[post.id]||0}件`;
    // bookmark status
    const{data:bmData}=await sb.from('bookmarks').select('id').eq('user_id',me.id).eq('post_id',post.id).single();
    if(bmData) bmBtn.classList.add('bookmarked');
  })();
  async function reactToPost(){
    if(reactBtn.classList.contains('reacted')) return;
    reactBtn.classList.add('reacted');
    const curCount=parseInt(reactBtn.textContent.replace('聴いたよ ',''))||0;
    reactBtn.textContent=`聴いたよ ${curCount+1}`;
    card.classList.add('greyed');
    addPlayed(post.id);
    await sb.from('reactions').insert({post_id:post.id,user_id:me.id}).catch(()=>{});
  }
  reactBtn.addEventListener('click',reactToPost);
  bmBtn.addEventListener('click',async()=>{
    if(bmBtn.classList.contains('bookmarked')){
      await sb.from('bookmarks').delete().eq('user_id',me.id).eq('post_id',post.id);
      bmBtn.classList.remove('bookmarked');
      showToast('ブックマークを解除しました');
    } else {
      await sb.from('bookmarks').insert({user_id:me.id,post_id:post.id}).catch(()=>{});
      bmBtn.classList.add('bookmarked');
      showToast('ブックマークしました');
    }
  });
  function seekTo(ratio,startPlay){
    if(!audio||!isLoaded) return;
    audio.currentTime=audio.duration*ratio;
    bars.forEach((b,i)=>b.classList.toggle('played',i/BAR_COUNT<ratio));
    if(startPlay&&audio.paused) audio.play();
  }
  wf.addEventListener('click',(e)=>{
    const rect=wf.getBoundingClientRect();
    const ratio=(e.clientX-rect.left)/rect.width;
    if(audio&&!audio.paused){
      seekTo(ratio,false);
    } else {
      if(audio&&isLoaded){
        seekTo(ratio,true);
        return;
      }
      startAudio(ratio);
    }
  });
  function startAudio(seekRatio){
    if(currentPlayingAudio&&currentPlayingAudio!==audio){
      currentPlayingAudio.pause();
      if(currentPlayingCard) currentPlayingCard.querySelectorAll('.waveform-bar').forEach(b=>b.classList.remove('played'));
    }
    if(!audio){
      const today=new Date().toISOString().split('T')[0];
      const pdate=post.post_date||today;
      const{data:urlData}=sb.storage.from('voice-posts').getPublicUrl(`${post.user_id}/${pdate}.webm`);
      audio=new Audio(urlData.publicUrl);
      audio.playbackRate=SPEED_OPTIONS[currentSpeedIdx];
      audio.addEventListener('loadedmetadata',()=>{
        isLoaded=true;
        durationLabel.textContent=Math.round(audio.duration)+'秒';
        if(seekRatio!=null) audio.currentTime=audio.duration*seekRatio;
      });
      audio.addEventListener('timeupdate',()=>{
        if(!audio.duration) return;
        const prog=audio.currentTime/audio.duration;
        bars.forEach((b,i)=>b.classList.toggle('played',i/BAR_COUNT<prog));
        if('mediaSession' in navigator){try{navigator.mediaSession.setPositionState({duration:audio.duration,playbackRate:audio.playbackRate,position:audio.currentTime});}catch(e){}}
      });
      audio.addEventListener('play',()=>{if('mediaSession' in navigator) navigator.mediaSession.playbackState='playing';});
      audio.addEventListener('pause',()=>{if('mediaSession' in navigator) navigator.mediaSession.playbackState='paused';});
      audio.addEventListener('ended',async()=>{
        bars.forEach(b=>b.classList.remove('played'));
        addPlayed(post.id);
        card.classList.add('greyed');
        await reactToPost();
        if(isPlayingAll&&playQueueIndex<playQueue.length-1){
          playQueueIndex++;
          playQueue[playQueueIndex]();
        } else if(isPlayingAll){
          isPlayingAll=false;
          $('btnPlayAll').textContent='全部聴く';
        }
        if('mediaSession' in navigator) navigator.mediaSession.playbackState='none';
      });
    }
    currentPlayingAudio=audio;
    currentPlayingCard=card;
    audio.play();
    addPlayed(post.id);
    card.classList.add('greyed');
    if('mediaSession' in navigator){
      navigator.mediaSession.metadata=new MediaMetadata({
        title:(post.post_date||'')+(post.tag?' ['+post.tag+']':''),
        artist:post.username||'',
        album:'コエリアル'
      });
      navigator.mediaSession.playbackState='playing';
      navigator.mediaSession.setActionHandler('play',()=>audio.play());
      navigator.mediaSession.setActionHandler('pause',()=>audio.pause());
    }
  }
  wf.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); startAudio(null); } });
  card.appendChild(wf);
  card.appendChild(actionsRow);
  // comments
  commentCountBtn.addEventListener('click',()=>toggleComments(card,post));
  return card;
}

async function toggleComments(card,post){
  const existing=card.querySelector('.comments-section');
  if(existing){existing.remove();return;}
  const sec=document.createElement('div');
  sec.className='comments-section';
  const{data:comments}=await sb.from('comments').select('*').eq('post_id',post.id).order('created_at',{ascending:true});
  const{data:profiles}=comments?.length?await sb.from('profiles').select('id,username').in('id',[...new Set(comments.map(c=>c.user_id))]):({data:[]});
  const profileMap={};
  (profiles||[]).forEach(p=>profileMap[p.id]=p.username);
  function renderComments(list){
    sec.innerHTML='';
    list.forEach(c=>{
      const row=document.createElement('div');
      row.className='comment-item';
      const author=document.createElement('span');
      author.className='comment-author';
      author.textContent=profileMap[c.user_id]||'?';
      const text=document.createElement('span');
      text.className='comment-text';
      text.textContent=' '+c.body;
      const time=document.createElement('span');
      time.className='comment-time';
      const cd=new Date(c.created_at);
      time.textContent=`${cd.getMonth()+1}/${cd.getDate()}`;
      row.appendChild(author);
      row.appendChild(text);
      row.appendChild(time);
      if(c.user_id===me.id){
        const del=document.createElement('button');
        del.className='comment-del';
        del.textContent='x';
        del.setAttribute('aria-label','コメント削除');
        del.addEventListener('click',async()=>{
          await sb.from('comments').delete().eq('id',c.id);
          const idx=list.indexOf(c);if(idx>-1)list.splice(idx,1);
          renderComments(list);
        });
        row.appendChild(del);
      }
      sec.appendChild(row);
    });
    const form=document.createElement('div');
    form.className='comment-form';
    const inp=document.createElement('input');
    inp.className='comment-input';
    inp.placeholder='コメント(30文字以内)';
    inp.maxLength=30;
    const sub=document.createElement('button');
    sub.className='comment-submit';
    sub.textContent='送信';
    sub.addEventListener('click',async()=>{
      const body=inp.value.trim();
      if(!body) return;
      const{data:nc,error}=await sb.from('comments').insert({post_id:post.id,user_id:me.id,body}).select().single();
      if(error){showToast('送信失敗');return;}
      profileMap[me.id]=myProfile?.username||'?';
      list.push(nc);
      inp.value='';
      renderComments(list);
    });
    form.appendChild(inp);
    form.appendChild(sub);
    sec.appendChild(form);
  }
  renderComments(comments||[]);
  card.appendChild(sec);
}

// bookmarks
async function loadBookmarks(){
  const el=$('bookmarkContent');
  el.innerHTML='<div class="spinner"></div>';
  const{data:bms}=await sb.from('bookmarks').select('post_id').eq('user_id',me.id);
  if(!bms||!bms.length){el.innerHTML='<p style="color:var(--text2)">ブックマークはありません</p>';return;}
  const postIds=bms.map(b=>b.post_id);
  const{data:posts}=await sb.from('friend_feed').select('*').in('id',postIds);

}

// profile
async function loadProfile(){
  $('profileAvatar').textContent=(myProfile?.username||'?')[0].toUpperCase();
  $('profileName').textContent=myProfile?.username||'';
  $('profileBio').textContent=myProfile?.bio||'';
  $('myFriendCode').textContent=myProfile?.friend_code||'';
  renderTagPicker();
  renderDurationPicker();
  await updateNotifToggle();
  // stats
  const{data:allPosts}=await sb.from('posts').select('post_date').eq('user_id',me.id).order('post_date',{ascending:true});
  const dates=(allPosts||[]).map(p=>p.post_date);
  $('statTotalPosts').textContent=dates.length;
  $('statMaxStreak').textContent=calcMaxStreak(dates)+'日';
  // reactions
  const{data:myPostsR}=await sb.from('posts').select('id,post_date').eq('user_id',me.id);
  const myPostIds=(myPostsR||[]).map(p=>p.id);
  const myPostDateMap={};
  (myPostsR||[]).forEach(p=>myPostDateMap[p.id]=p.post_date);
  let reactionHtml='';
  if(myPostIds.length){
    const{data:reactions}=await sb.from('reactions').select('user_id,created_at,post_id').in('post_id',myPostIds).order('created_at',{ascending:false}).limit(10);
    const reactorIds=[...new Set((reactions||[]).map(r=>r.user_id))];
    let reactorMap={};
    if(reactorIds.length){
      const{data:rp}=await sb.from('profiles').select('id,username').in('id',reactorIds);
      (rp||[]).forEach(p=>reactorMap[p.id]=p.username);
    }
    reactionHtml=(reactions||[]).map(r=>{
      const d=new Date(r.created_at);
      return `<div style="font-size:.82rem;padding:4px 0;border-bottom:1px solid var(--surface2)">${reactorMap[r.user_id]||'?'} が ${myPostDateMap[r.post_id]||'?'} の声に「聴いたよ」<span style="color:var(--text2);font-size:.75rem;margin-left:6px">${d.getMonth()+1}/${d.getDate()}</span></div>`;
    }).join('')||'<p style="color:var(--text2);font-size:.85rem">まだありません</p>';
  } else { reactionHtml='<p style="color:var(--text2);font-size:.85rem">まだありません</p>'; }
  $('reactionList').innerHTML=reactionHtml;
  // comment notifications
  let commentNotifHtml='';
  if(myPostIds.length){
    const{data:cnotifs}=await sb.from('comments').select('user_id,created_at,post_id,body').in('post_id',myPostIds).order('created_at',{ascending:false}).limit(10);
    const cnotifUserIds=[...new Set((cnotifs||[]).map(c=>c.user_id).filter(id=>id!==me.id))];
    let cnotifMap={};
    if(cnotifUserIds.length){
      const{data:cp}=await sb.from('profiles').select('id,username').in('id',cnotifUserIds);
      (cp||[]).forEach(p=>cnotifMap[p.id]=p.username);
    }
    const filteredCnotifs=(cnotifs||[]).filter(c=>c.user_id!==me.id);
    commentNotifHtml=filteredCnotifs.map(c=>{
      const d=new Date(c.created_at);
      return `<div style="font-size:.82rem;padding:4px 0;border-bottom:1px solid var(--surface2)">${cnotifMap[c.user_id]||'?'} が ${myPostDateMap[c.post_id]||'?'} の声にコメント: <span style="color:var(--text2)">${c.body}</span><span style="color:var(--text2);font-size:.75rem;margin-left:6px">${d.getMonth()+1}/${d.getDate()}</span></div>`;
    }).join('')||'<p style="color:var(--text2);font-size:.85rem">まだありません</p>';
  } else { commentNotifHtml='<p style="color:var(--text2);font-size:.85rem">まだありません</p>'; }
  $('commentNotifList').innerHTML=commentNotifHtml;
  // profile tab badge
  const lastSeen=parseInt(localStorage.getItem('lastSeenNotifCount')||'0');
  const totalNotifs=((reactionHtml.match(/聴いたよ/g)||[]).length)+((commentNotifHtml.match(/コメント:/g)||[]).length);
  if(totalNotifs>lastSeen){
    $('profileTabBadge').textContent=totalNotifs-lastSeen;
    $('profileTabBadge').style.display='flex';
  } else {
    $('profileTabBadge').style.display='none';
  }
  localStorage.setItem('lastSeenNotifCount',totalNotifs);
  // friends
  const{data:friendships}=await sb.from('friendships').select('friend_id').eq('user_id',me.id);
  let friendHtml='';
  if(friendships&&friendships.length){
    const fids=friendships.map(f=>f.friend_id);
    const{data:fps}=await sb.from('profiles').select('id,username').in('id',fids);
    const today=new Date().toISOString().split('T')[0];
    const{data:todayPosts}=await sb.from('posts').select('user_id').eq('post_date',today).in('user_id',fids);
    const postedToday=new Set((todayPosts||[]).map(p=>p.user_id));
    const mutedRaw=myProfile?.muted_friends||[];
    const muted=new Set(Array.isArray(mutedRaw)?mutedRaw:[]);
    friendHtml=(fps||[]).map(f=>{
      const isMuted=muted.has(f.id);
      const posted=postedToday.has(f.id);
      return `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--surface2)">
        <span style="flex:1;font-size:.9rem">${f.username}</span>
        ${posted?'<span style="font-size:.7rem;background:var(--success);color:#fff;padding:2px 6px;border-radius:4px">投稿済</span>':''}
        <button class="action-btn" data-mute="${f.id}" style="font-size:.75rem;${isMuted?'background:var(--warning);color:#111':''}">  ${isMuted?'ミュート中':'ミュート'}</button>
        <button class="action-btn" data-remove="${f.id}" style="color:var(--danger);font-size:.75rem">解除</button>
      </div>`;
    }).join('');
  } else { friendHtml='<p style="color:var(--text2);font-size:.85rem">フレンドはまだいません</p>'; }
  $('friendList').innerHTML=friendHtml;
  $('friendList').querySelectorAll('[data-remove]').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const fid=btn.dataset.remove;
      await sb.rpc('remove_friend',{friend_id:fid});
      showToast('フレンドを解除しました');
      loadProfile();
    });
  });
  $('friendList').querySelectorAll('[data-mute]').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const fid=btn.dataset.mute;
      const mutedRaw=myProfile?.muted_friends||[];
      const muted=new Set(Array.isArray(mutedRaw)?mutedRaw:[]);
      if(muted.has(fid)) muted.delete(fid); else muted.add(fid);
      const newMuted=[...muted];
      const{error}=await sb.from('profiles').update({muted_friends:newMuted}).eq('id',me.id);
      if(error){showToast('失敗: '+error.message);return;}
      myProfile={...myProfile,muted_friends:newMuted};
      showToast(muted.has(fid)?'ミュートしました':'ミュートを解除しました');
      loadProfile();
    });
  });
  // calendar
  renderCalendar(dates);
}

// calendar
function renderCalendar(dates){
  const posted=new Set(dates);
  const now=new Date();
  const year=now.getFullYear();
  const month=now.getMonth();
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const wrap=$('calendarWrap');
  wrap.innerHTML=`<p style="font-size:.82rem;color:var(--text2);margin-bottom:6px">${year}年${month+1}月</p>`;
  const grid=document.createElement('div');
  grid.className='cal-grid';
  ['日','月','火','水','木','金','土'].forEach(d=>{
    const h=document.createElement('div');
    h.className='cal-cell header';
    h.textContent=d;
    grid.appendChild(h);
  });
  for(let i=0;i<firstDay;i++){const e=document.createElement('div');e.className='cal-cell';grid.appendChild(e);}
  for(let d=1;d<=daysInMonth;d++){
    const cell=document.createElement('div');
    cell.className='cal-cell';
    cell.textContent=d;
    const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if(posted.has(dateStr)){
      cell.classList.add('posted');
      cell.setAttribute('role','button');
      cell.setAttribute('aria-label',`${dateStr}の声を再生`);
      cell.addEventListener('click',()=>playArchive(dateStr));
    }
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);
}

async function playArchive(dateStr){
  const{data:urlData}=sb.storage.from('voice-posts').getPublicUrl(`${me.id}/${dateStr}.webm`);
  const audio=new Audio(urlData.publicUrl);
  if(currentPlayingAudio)currentPlayingAudio.pause();
  currentPlayingAudio=audio;
  audio.play();
  showToast(`${dateStr}の声を再生中`);
}

function calcCurrentStreak(){
  if(!myPostDates.length) return 0;
  const today=new Date();
  let streak=0;
  for(let i=0;;i++){
    const d=new Date(today);
    d.setDate(today.getDate()-i);
    const ds=d.toISOString().split('T')[0];
    if(myPostDates.includes(ds)){streak++;}
    else break;
  }
  return streak;
}
function calcMaxStreak(dates){
  if(!dates.length) return 0;
  const sorted=[...new Set(dates)].sort();
  let max=1,cur=1;
  for(let i=1;i<sorted.length;i++){
    const prev=new Date(sorted[i-1]);
    const curr=new Date(sorted[i]);
    const diff=(curr-prev)/86400000;
    if(diff===1){cur++;max=Math.max(max,cur);}
    else cur=1;
  }
  return max;
}

async function showMiniProfile(userId){
  const{data:prof}=await sb.from('profiles').select('*').eq('id',userId).single();

  $('mpName').textContent=prof.username||'?';
  $('mpBio').textContent=prof.bio||'';
  $('mpPostCount').textContent=posts?.length||0;
  // friend streak
  const pDates=(posts||[]).map(p=>p.post_date).sort();
  let fStreak=0;
  const today=new Date();
  for(let i=0;;i++){
    const d=new Date(today);
    d.setDate(today.getDate()-i);
    const ds=d.toISOString().split('T')[0];
    if(pDates.includes(ds)){fStreak++;}
    else break;

  $('miniProfileModal').style.display='flex';
  $('miniProfileModal').dataset.userId=userId;
}
