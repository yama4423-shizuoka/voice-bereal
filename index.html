<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>コエリアル</title>
  <meta name="description" content="声のBeReal。毎日ランダムな時刻に通知が届き、30秒以内にそのときの声を残す。加工なし、フィルターなし。">
  <meta property="og:title" content="コエリアル - 声のBeReal">
  <meta property="og:description" content="毎日ランダムな時刻に通知が届き、30秒以内にそのときの声を残す。加工なし、フィルターなし。">
  <meta property="og:image" content="https://voice-bereal.vercel.app/ogp.svg">
  <meta property="og:url" content="https://voice-bereal.vercel.app/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://voice-bereal.vercel.app/ogp.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="preconnect" href="https://esm.sh">
  <link rel="preconnect" href="https://hbkknijwdppojhzybcit.supabase.co">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{
      --bg:#0a0a0a; --card:#141414; --accent:#e8ff5a; --muted:#666;
      --danger:#ff4d4d; --radius:18px; --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    html,body{height:100%;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overscroll-behavior:none}
    #app{display:flex;flex-direction:column;height:100%;max-width:430px;margin:0 auto}
    /* ---- screens ---- */
    .screen{display:none;flex:1;overflow-y:auto;padding:20px 16px;padding-bottom:calc(80px + var(--safe-bottom))}
    .screen.active{display:flex;flex-direction:column}
    /* ---- auth ---- */
    .auth-logo{font-size:2rem;font-weight:900;text-align:center;margin-bottom:8px}
    .auth-tagline{font-size:.85rem;color:var(--muted);text-align:center;margin-bottom:32px}
    .input-group{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
    input[type=email],input[type=password],input[type=text]{
      background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;
      color:#fff;font-size:1rem;padding:14px 16px;width:100%;
      -webkit-appearance:none;
    }
    input:focus{outline:2px solid var(--accent);border-color:transparent}
    .btn{border:none;border-radius:14px;cursor:pointer;font-size:1rem;font-weight:700;padding:16px;width:100%;transition:opacity .15s}
    .btn:active{opacity:.7}
    .btn-primary{background:var(--accent);color:#000}
    .btn-secondary{background:#1e1e1e;color:#fff}
    .btn-danger{background:var(--danger);color:#fff}
    .btn-ghost{background:transparent;border:1px solid #333;color:#fff}
    .tab-switch{display:flex;background:#1a1a1a;border-radius:12px;padding:4px;margin-bottom:24px}
    .tab-switch button{flex:1;background:none;border:none;color:var(--muted);font-size:.9rem;font-weight:600;padding:10px;border-radius:10px;cursor:pointer;transition:all .2s}
    .tab-switch button.active{background:#2a2a2a;color:#fff}
    .auth-link{background:none;border:none;color:var(--accent);font-size:.85rem;cursor:pointer;text-align:center;padding:8px;width:100%}
    /* ---- onboarding ---- */
    #screenOnboard{align-items:center;justify-content:center;text-align:center;gap:20px}
    .onboard-title{font-size:1.4rem;font-weight:900}
    .onboard-steps{display:flex;flex-direction:column;gap:12px;text-align:left;width:100%}
    .onboard-step{background:var(--card);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
    .onboard-step-num{background:var(--accent);color:#000;font-weight:900;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.85rem}
    .onboard-step-text{font-size:.9rem;line-height:1.5}
    /* ---- feed ---- */
    .feed-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .feed-title{font-size:1.1rem;font-weight:800}
    .time-badge{background:var(--accent);color:#000;border-radius:20px;padding:4px 12px;font-size:.8rem;font-weight:700}
    .post-card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px}
    .post-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#000;font-weight:900;font-size:.9rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .post-name{font-weight:700;font-size:.95rem}
    .post-time{font-size:.75rem;color:var(--muted);margin-top:2px}
    .post-bio{font-size:.78rem;color:var(--muted);margin-top:2px;font-style:italic}
    .post-caption{font-size:.85rem;color:#ccc;margin-top:10px;line-height:1.5}
    .play-row{display:flex;gap:8px;align-items:center}
    .play-btn{background:var(--accent);border:none;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:opacity .15s}
    .play-btn:active{opacity:.7}
    .play-btn svg{width:20px;height:20px;fill:#000}
    .waveform{flex:1;height:36px;background:#1e1e1e;border-radius:8px;overflow:hidden;position:relative}
    .waveform-bar{position:absolute;bottom:0;width:3px;background:#333;border-radius:2px 2px 0 0}
    .waveform-progress{position:absolute;bottom:0;left:0;height:100%;background:rgba(232,255,90,.08);pointer-events:none;transition:width .1s linear}
    .duration-label{font-size:.75rem;color:var(--muted);flex-shrink:0}
    .speed-btn{background:#222;border:1px solid #333;color:#aaa;border-radius:8px;padding:4px 8px;font-size:.75rem;font-weight:700;cursor:pointer;flex-shrink:0}
    .speed-btn:active{opacity:.7}
    .reaction-row{display:flex;align-items:center;gap:8px;margin-top:10px}
    .reaction-btn{background:#1e1e1e;border:1px solid #2a2a2a;border-radius:20px;color:#aaa;font-size:.78rem;font-weight:600;padding:5px 12px;cursor:pointer;transition:all .2s}
    .reaction-btn.reacted{background:#2a2a1a;border-color:var(--accent);color:var(--accent)}
    .on-time-badge{background:#1a2a00;border:1px solid var(--accent);color:var(--accent);border-radius:10px;padding:2px 8px;font-size:.7rem;font-weight:700}
    .streak-banner{background:#1a2a00;border:1px solid var(--accent);border-radius:14px;padding:12px 16px;margin-bottom:16px;text-align:center;font-weight:700;font-size:.95rem;color:var(--accent)}
    /* ---- rec modal ---- */
    #recModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:100;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
    #recModal.open{display:flex}
    .rec-timer{font-size:3rem;font-weight:900;letter-spacing:-2px}
    .rec-bar{width:80%;height:6px;background:#222;border-radius:3px;overflow:hidden}
    .rec-bar-fill{height:100%;background:var(--accent);width:0%;transition:width .5s linear}
    .rec-caption-wrap{width:80%}
    .rec-caption-wrap input{background:#1a1a1a;border:1px solid #333}
    .rec-caption-counter{font-size:.75rem;color:var(--muted);text-align:right;margin-top:4px}
    /* visualizer */
    #vizCanvas{width:80%;height:48px;border-radius:8px;background:#1a1a1a}
    /* ---- profile ---- */
    .profile-header{display:flex;align-items:center;gap:16px;margin-bottom:24px}
    .avatar-lg{width:64px;height:64px;border-radius:50%;background:var(--accent);color:#000;font-weight:900;font-size:1.6rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .profile-name{font-size:1.2rem;font-weight:800}
    .profile-code{font-size:.75rem;color:var(--muted);font-weight:600;margin-top:2px}
    .profile-bio{font-size:.85rem;color:#aaa;margin-top:4px}
    .section-label{font-size:.75rem;color:var(--muted);font-weight:700;margin:20px 0 10px;letter-spacing:.05em}
    .profile-stat{font-size:.85rem;color:#aaa;margin-bottom:8px}
    /* ---- calendar ---- */
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
    .cal-day{aspect-ratio:1;border-radius:8px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--muted)}
    .cal-day.posted{background:var(--accent);color:#000;font-weight:700;cursor:pointer}
    .cal-day.empty{background:transparent}
    /* ---- friends ---- */
    .friend-card{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
    .friend-info{display:flex;align-items:center;gap:10px}
    .friend-name{font-weight:700;font-size:.95rem}
    .friend-status{font-size:.65rem;border-radius:8px;padding:2px 7px;margin-top:3px;display:inline-block}
    .friend-status.posted{background:#1a2a00;border:1px solid var(--accent);color:var(--accent)}
    .friend-status.not-posted{background:#1a1a1a;color:var(--muted)}
    /* ---- preview ---- */
    #recPreview{display:none;flex-direction:column;gap:10px;width:80%}
    #recPreview.show{display:flex}
    /* ---- toast ---- */
    #toast{position:fixed;bottom:calc(90px + var(--safe-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:#222;border:1px solid #333;border-radius:12px;padding:10px 20px;font-size:.875rem;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap;z-index:200}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    /* ---- record fab ---- */
    #fabRec{position:fixed;bottom:calc(72px + var(--safe-bottom));left:50%;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(232,255,90,.3);z-index:10}
    #fabRec svg{width:28px;height:28px;fill:#000}
    #fabRec:active{transform:translateX(-50%) scale(.92)}
    /* ---- nav ---- */
    nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(10,10,10,.95);backdrop-filter:blur(10px);border-top:1px solid #1a1a1a;display:flex;justify-content:space-around;padding:8px 0;padding-bottom:calc(8px + var(--safe-bottom));z-index:10}
    .nav-btn{background:none;border:none;color:var(--muted);font-size:.65rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 16px;cursor:pointer;transition:color .15s}
    .nav-btn.active,.nav-btn:focus-visible{color:#fff}
    .nav-btn svg{width:22px;height:22px}
    /* ---- push setup ---- */
    .push-card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:16px}
    /* ---- reset screen ---- */
    #screenReset{align-items:stretch}
  </style>
</head>
<body>
<div id="app">
  <!-- AUTH -->
  <div id="screenAuth" class="screen active" role="main" aria-label="認証">
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center">
      <p class="auth-logo">コエリアル</p>
      <p class="auth-tagline">声のBeReal</p>
      <div class="tab-switch" role="tablist">
        <button id="tabLogin" role="tab" aria-selected="true" aria-controls="panelLogin" class="active">ログイン</button>
        <button id="tabSignup" role="tab" aria-selected="false" aria-controls="panelSignup">新規登録</button>
      </div>
      <div id="panelLogin" role="tabpanel" aria-labelledby="tabLogin">
        <div class="input-group">
          <input type="email" id="inEmail" placeholder="メールアドレス" autocomplete="email" aria-label="メールアドレス">
          <input type="password" id="inPass" placeholder="パスワード" autocomplete="current-password" aria-label="パスワード">
        </div>
        <button class="btn btn-primary" id="btnLogin">ログイン</button>
        <button class="auth-link" id="btnForgotPw" aria-label="パスワードを忘れた場合はこちら">パスワードを忘れた場合</button>
      </div>
      <div id="panelSignup" role="tabpanel" aria-labelledby="tabSignup" hidden>
        <div class="input-group">
          <input type="text" id="inName" placeholder="表示名" maxlength="20" autocomplete="nickname" aria-label="表示名">
          <input type="email" id="inEmail2" placeholder="メールアドレス" autocomplete="email" aria-label="メールアドレス">
          <input type="password" id="inPass2" placeholder="パスワード(6文字以上)" autocomplete="new-password" aria-label="パスワード">
        </div>
        <button class="btn btn-primary" id="btnSignup">アカウントを作成</button>
      </div>
    </div>
  </div>

  <!-- PASSWORD RESET -->
  <div id="screenReset" class="screen" role="main" aria-label="パスワード再設定">
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px">
      <p style="font-size:1.1rem;font-weight:800;text-align:center">パスワード再設定</p>
      <p style="font-size:.85rem;color:var(--muted);text-align:center">新しいパスワードを入力してください</p>
      <input type="password" id="inNewPass" placeholder="新しいパスワード(6文字以上)" autocomplete="new-password" aria-label="新しいパスワード">
      <button class="btn btn-primary" id="btnSetNewPass">パスワードを更新</button>
    </div>
  </div>

  <!-- ONBOARDING -->
  <div id="screenOnboard" class="screen" role="main" aria-label="はじめかた">
    <p class="onboard-title">コエリアルをはじめよう</p>
    <p style="color:var(--muted);font-size:.85rem">ホーム画面に追加して通知を受け取ろう</p>
    <div class="onboard-steps" id="onboardSteps"></div>
    <button class="btn btn-primary" id="btnOnboardDone">はじめる</button>
    <button class="auth-link" id="btnOnboardSkip">スキップ</button>
  </div>

  <!-- FEED -->
  <div id="screenFeed" class="screen" role="main" aria-label="フィード">
    <div class="feed-header">
      <span class="feed-title">コエリアル</span>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="time-badge" id="todayTimeBadge" aria-live="polite"></span>
        <button id="btnRefreshFeed" class="btn btn-ghost" style="width:auto;padding:6px 12px;font-size:.78rem" aria-label="フィードを更新">更新</button>
      </div>
    </div>
    <div id="streakBanner"></div>
    <div id="feedList" aria-live="polite" aria-label="投稿一覧"></div>
  </div>

  <!-- PROFILE -->
  <div id="screenProfile" class="screen" role="main" aria-label="プロフィール">
    <div class="profile-header">
      <div class="avatar-lg" id="profAvatar" aria-hidden="true"></div>
      <div>
        <p class="profile-name" id="profName"></p>
        <p class="profile-code" id="profCode"></p>
        <p class="profile-bio" id="profBio"></p>
      </div>
    </div>
    <input type="text" id="inPName" placeholder="表示名" maxlength="20" aria-label="表示名を編集">
    <input type="text" id="inPBio" placeholder="ひとこと(40文字以内)" maxlength="40" style="margin-top:8px" aria-label="ひとことを編集">
    <button class="btn btn-secondary" style="margin-top:10px" id="btnSaveProfile">保存</button>
    <p class="section-label">フレンドコード</p>
    <div style="display:flex;gap:8px;align-items:center">
      <p id="myFriendCode" style="font-size:1.1rem;font-weight:800;letter-spacing:.1em"></p>
      <button class="btn btn-ghost" style="width:auto;padding:8px 16px;font-size:.8rem" id="btnCopyInvite">招待文をコピー</button>
    </div>
    <p class="section-label">フレンドを追加</p>
    <div style="display:flex;gap:8px">
      <input type="text" id="inFriendCode" placeholder="フレンドコードを入力" maxlength="8" style="flex:1" aria-label="フレンドコード入力">
      <button class="btn btn-primary" style="width:auto;padding:0 16px" id="btnAddFriend">追加</button>
    </div>
    <p class="section-label">フレンド一覧</p>
    <div id="friendList"></div>
    <p class="section-label">投稿カレンダー</p>
    <div id="calNav" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <button id="calPrev" style="background:none;border:none;color:#fff;font-size:1.2rem;cursor:pointer" aria-label="前の月">&lt;</button>
      <span id="calTitle" style="font-weight:700"></span>
      <button id="calNext" style="background:none;border:none;color:#fff;font-size:1.2rem;cursor:pointer" aria-label="次の月">&gt;</button>
    </div>
    <div class="cal-grid" id="calGrid" aria-label="投稿カレンダー"></div>
    <p id="calCaption" style="display:none;font-size:.85rem;color:#ccc;margin-top:8px;line-height:1.5"></p>
    <p class="section-label">通知設定</p>
    <div class="push-card">
      <p style="font-size:.85rem;color:#aaa;margin-bottom:12px">毎日ランダムな時刻に「声を残そう」通知を受け取る</p>
      <button class="btn btn-primary" id="btnPushSub">通知をオンにする</button>
    </div>
    <p class="section-label">ヘルプ</p>
    <button class="btn btn-ghost" style="margin-bottom:8px" id="btnShowOnboard">はじめかたを見る</button>
    <button class="btn btn-ghost" id="btnLogout">ログアウト</button>
    <p style="font-size:.7rem;color:var(--muted);text-align:center;margin-top:16px">コエリアル v0.1</p>
  </div>

  <!-- FAB -->
  <button id="fabRec" aria-label="録音を開始する">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
  </button>

  <!-- REC MODAL -->
  <div id="recModal" role="dialog" aria-modal="true" aria-label="録音">
    <p class="rec-timer" id="recTimer" aria-live="polite">00:00</p>
    <canvas id="vizCanvas" aria-hidden="true"></canvas>
    <div class="rec-bar" role="progressbar" aria-valuemin="0" aria-valuemax="30" aria-valuenow="0" id="recProgress">
      <div class="rec-bar-fill" id="recBarFill"></div>
    </div>
    <div class="rec-caption-wrap">
      <input type="text" id="inCaption" placeholder="ひとことメモ(任意)" maxlength="50" aria-label="ひとことメモ">
      <span id="captionCounter" class="rec-caption-counter" aria-live="polite">0/50</span>
    </div>
    <button class="btn btn-danger" style="width:80%" id="btnStopRec">録音を止める</button>
    <button class="btn btn-ghost" style="width:80%" id="btnCancelRec">キャンセル</button>
    <div id="recPreview">
      <p style="color:var(--muted);font-size:.85rem;font-weight:700">録音を確認してください</p>
      <button class="btn btn-ghost" style="width:100%" id="btnPreviewPlay" aria-label="録音を再生して確認する">再生して確認</button>
      <button class="btn btn-primary" style="width:100%" id="btnPostConfirm">この声で投稿する</button>
      <button class="btn btn-ghost" style="width:100%" id="btnReRecord">撮り直す</button>
    </div>
  </div>

  <!-- NAV -->
  <nav id="nav" aria-label="メインナビゲーション">
    <button class="nav-btn active" id="navFeed" aria-label="フィード" aria-current="page">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
      フィード
    </button>
    <button class="nav-btn" id="navProfile" aria-label="プロフィール">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
      プロフィール
    </button>
  </nav>

  <div id="toast" role="alert" aria-live="assertive"></div>
</div>

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function todayJST(){
  const d=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Tokyo'}));
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDate(iso){
  const d=new Date(iso);
  return d.toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Tokyo'});
}

// ---- daily time badge ----
function dailyMinutes(){
  const today=todayJST();
  let h=0;
  for(let i=0;i<today.length;i++) h=(h*31+today.charCodeAt(i))&0xfffffff;
  return 11*60 + (h % (10*60));
}
function showTodayBadge(){
  const mins=dailyMinutes();
  const h=Math.floor(mins/60), m=mins%60;
  $('todayTimeBadge').textContent=`本日 ${h}:${String(m).padStart(2,'0')}`;
}

// ---- streak ----
async function showStreak(){
  if(!me) return;
  const {data}=await sb.from('posts').select('post_date').eq('user_id',me.id).order('post_date',{ascending:false}).limit(60);
  if(!data||data.length<3){$('streakBanner').innerHTML='';return;}
  const dates=data.map(r=>r.post_date);
  const today=todayJST();
  let streak=0, cur=today;
  for(let i=0;i<dates.length;i++){
    if(dates[i]===cur){ streak++; const d=new Date(cur); d.setDate(d.getDate()-1); cur=d.toISOString().slice(0,10); }
    else break;
  }
  if(streak>=3){
    $('streakBanner').innerHTML=`<div class="streak-banner">${streak}日連続で声を残しています</div>`;
  } else {
    $('streakBanner').innerHTML='';
  }
}

let currentAudio=null, currentBtn=null, currentWave=null;
function playPost(btn){
  const path=btn.dataset.path;
  const dur=parseInt(btn.dataset.dur)||30;
  const card=btn.closest('.post-card');
  const wave=card.querySelector('.waveform-progress');
  const speedBtn=card.querySelector('.speed-btn');
  const speed=parseFloat(speedBtn?.textContent?.replace('x','')||'1');
  if(currentAudio){
    currentAudio.pause(); currentAudio=null;
    if(currentBtn)currentBtn.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
    if(currentWave)currentWave.style.width='0%';
    if(currentBtn===btn){currentBtn=null;currentWave=null;return;}
  }
  sb.storage.from('voice-posts').createSignedUrl(path,60).then(({data})=>{
    if(!data?.signedUrl) return;
    const audio=new Audio(data.signedUrl);
    audio.playbackRate=speed;
    currentAudio=audio; currentBtn=btn; currentWave=wave;
    btn.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
    audio.play();
    const interval=setInterval(()=>{
      if(!audio.paused) wave.style.width=(audio.currentTime/dur*100)+'%';
    },100);
    audio.onended=()=>{
      clearInterval(interval); wave.style.width='0%';
      btn.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
      currentAudio=null; currentBtn=null; currentWave=null;
    };
  });
}

function cycleSpeed(btn){
  const speeds=[0.75,1,1.5];
  const cur=parseFloat(btn.textContent.replace('x',''))||1;
  const next=speeds[(speeds.indexOf(cur)+1)%speeds.length];
  btn.textContent='x'+next;
  const card=btn.closest('.post-card');
  const playBtn=card.querySelector('.play-btn');
  if(currentBtn===playBtn && currentAudio) currentAudio.playbackRate=next;
}

async function toggleReaction(btn){
  const pid=btn.dataset.pid;
  const reacted=btn.classList.contains('reacted');
  if(reacted){
    await sb.from('reactions').delete().eq('user_id',me.id).eq('post_id',pid);
    btn.classList.remove('reacted'); btn.textContent='聴いたよ'; btn.setAttribute('aria-pressed','false');
  } else {
    const {error}=await sb.from('reactions').insert({user_id:me.id,post_id:pid});
    if(!error){ btn.classList.add('reacted'); btn.textContent='聴いたよ済み'; btn.setAttribute('aria-pressed','true'); }
    else if(error.code==='23505'){ btn.classList.add('reacted'); btn.textContent='聴いたよ済み'; btn.setAttribute('aria-pressed','true'); }
    else showToast('エラー: '+error.message);
  }
}

// ---- visualizer ----
function startViz(stream){
  const ctx=new AudioContext();
  const src=ctx.createMediaStreamSource(stream);
  const analyser=ctx.createAnalyser();
  analyser.fftSize=64; src.connect(analyser);
  vizAnalyser=analyser;
  const canvas=$('vizCanvas');
  const cctx=canvas.getContext('2d');
  canvas.width=canvas.offsetWidth*2; canvas.height=canvas.offsetHeight*2;
  const buf=new Uint8Array(analyser.frequencyBinCount);
  function draw(){
    vizAf=requestAnimationFrame(draw);
    analyser.getByteFrequencyData(buf);
    cctx.clearRect(0,0,canvas.width,canvas.height);
    const barW=canvas.width/buf.length;
    buf.forEach((v,i)=>{
      const h=v/255*canvas.height;
      cctx.fillStyle='#e8ff5a';
      cctx.fillRect(i*barW,canvas.height-h,barW-1,h);
    });
  }
  draw();
}
function stopViz(){ if(vizAf){cancelAnimationFrame(vizAf);vizAf=null;} vizAnalyser=null; }

// ---- recording ----
async function startRecording(){
  audioChunks=[];
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder=new MediaRecorder(stream);
    mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
    mediaRecorder.start();
    startViz(stream);
    recSeconds=0;
    $('recTimer').textContent='00:00';
    $('recBarFill').style.width='0%';
    $('recProgress').setAttribute('aria-valuenow','0');
    $('inCaption').value=''; $('captionCounter').textContent='0/50';
    $('recModal').classList.add('open');
    recInterval=setInterval(()=>{
      recSeconds++;
      const m=Math.floor(recSeconds/60), s=recSeconds%60;
      $('recTimer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      const pct=Math.min(recSeconds/30*100,100);
      $('recBarFill').style.width=pct+'%';
      $('recProgress').setAttribute('aria-valuenow',String(recSeconds));
      if(recSeconds>=30) stopRecording();
    },1000);
  } catch(e){
    showToast('マイクにアクセスできませんでした');
  }
}

async function stopRecording(){
  clearInterval(recInterval);
  stopViz();
  if(!mediaRecorder||mediaRecorder.state==='inactive') return;
  return new Promise(res=>{
    mediaRecorder.onstop=async()=>{
      mediaRecorder.stream.getTracks().forEach(t=>t.stop());
      previewBlob=new Blob(audioChunks,{type:'audio/webm'});
      previewDur=recSeconds;
      // show preview UI
      $('recTimer').style.display='none';
      $('vizCanvas').style.display='none';
      $('recProgress').style.display='none';
      $('btnStopRec').style.display='none';
      $('btnCancelRec').style.display='none';
      $('recPreview').classList.add('show');
      res();
    };
    mediaRecorder.stop();
  });
}

// ---- calendar ----
function renderCalendar(posts){
  calPostDates=posts;
  const yr=calYear, mo=calMonth;
  $('calTitle').textContent=`${yr}年${mo}月`;
  const firstDay=new Date(yr,mo-1,1).getDay();
  const daysInMonth=new Date(yr,mo,0).getDate();
  const postedSet=new Set(posts.filter(p=>{
    const d=p.post_date||p.created_at?.slice(0,10);
    return d&&d.startsWith(`${yr}-${String(mo).padStart(2,'0')}`);
  }).map(p=>parseInt((p.post_date||p.created_at?.slice(0,10)).slice(8,10))));
  let html='';
  ['日','月','火','水','木','金','土'].forEach(d=>{ html+=`<div class="cal-day" style="color:var(--muted);font-size:.65rem">${d}</div>`; });
  for(let i=0;i<firstDay;i++) html+='<div class="cal-day empty"></div>';
  for(let d=1;d<=daysInMonth;d++){
    if(postedSet.has(d)){
      html+=`<div class="cal-day posted" data-day="${d}" role="button" tabindex="0" aria-label="${mo}月${d}日 録音あり">${d}</div>`;
    } else {
      html+=`<div class="cal-day">${d}</div>`;
    }
  }
  $('calGrid').innerHTML=html;
  $('calCaption').style.display='none';
  $('calGrid').querySelectorAll('.cal-day.posted').forEach(el=>{
    el.addEventListener('click',()=>playCalDay(parseInt(el.dataset.day)));
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' ') playCalDay(parseInt(el.dataset.day)); });
  });
}

async function playCalDay(day){
  const yr=calYear, mo=calMonth;
  const dateStr=`${yr}-${String(mo).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  const post=calPostDates.find(p=>(p.post_date||p.created_at?.slice(0,10))===dateStr);
  if(!post) return;
  const capEl=$('calCaption');
  if(post.caption){ capEl.textContent=post.caption; capEl.style.display=''; }
  else { capEl.style.display='none'; }
  const {data}=await sb.storage.from('voice-posts').createSignedUrl(post.storage_path,60);
  if(!data?.signedUrl){ showToast('再生できませんでした'); return; }
  if(currentAudio){ currentAudio.pause(); currentAudio=null; }
  const audio=new Audio(data.signedUrl);
  currentAudio=audio;
  audio.play();
  showToast(`${mo}月${day}日の声を再生中`);
  audio.onended=()=>{ currentAudio=null; };
}

// ---- push notifications ----
async function subscribePush(){
  if(!('serviceWorker' in navigator&&'PushManager' in window)){
    showToast('このブラウザはプッシュ通知に対応していません'); return;
  }
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){ showToast('通知が許可されませんでした'); return; }
  const reg=await navigator.serviceWorker.ready;
  const VAPID_PUBLIC='BNmIe8LqSJb2Qp0Y73xR_FxpQY6LCN-d-LUG7YRSB7jQ-2FE8VcT0s9GtnOEjrj1OBpd3cZfgqLxmS4OlE5DzA';
  let sub=await reg.pushManager.getSubscription();
  if(!sub){
    sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:VAPID_PUBLIC});
  }
  const subJson=sub.toJSON();
  const {error}=await sb.from('subscriptions').upsert({user_id:me.id,endpoint:subJson.endpoint,p256dh:subJson.keys.p256dh,auth:subJson.keys.auth},{onConflict:'endpoint'});
  if(error){ showToast('通知登録失敗: '+error.message); return; }
  showToast('通知をオンにしました');
  $('btnPushSub').textContent='通知オン済み';
  $('btnPushSub').disabled=true;
}

    $('tabSignup').classList.add('active'); $('tabLogin').classList.remove('active');
    $('tabSignup').setAttribute('aria-selected','true'); $('tabLogin').setAttribute('aria-selected','false');
    $('panelSignup').hidden=false; $('panelLogin').hidden=true;
  });
  // login
  $('btnLogin').addEventListener('click', async ()=>{
    const email=$('inEmail').value.trim(), pass=$('inPass').value;
    if(!email||!pass){ showToast('メールアドレスとパスワードを入力してください'); return; }
    const {error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error){ showToast('ログイン失敗: '+error.message); return; }
    const {data:{session}}=await sb.auth.getSession();
    me=session.user; await afterLogin();
  });
  // forgot password
  $('btnForgotPw').addEventListener('click', async ()=>{
    const email=$('inEmail').value.trim();
    if(!email){ showToast('メールアドレスを入力してください'); return; }
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+'/'});
    if(error){ showToast('送信失敗: '+error.message); return; }
    showToast('パスワード再設定メールを送信しました');
  });
  // password reset submit
  $('btnSetNewPass').addEventListener('click', async ()=>{
    const newPass=$('inNewPass').value;
    if(!newPass||newPass.length<6){ showToast('6文字以上のパスワードを入力してください'); return; }
    const {error}=await sb.auth.updateUser({password:newPass});
    if(error){ showToast('更新失敗: '+error.message); return; }
    showToast('パスワードを更新しました。ログインしてください');
    window.location.hash='';
    showScreen('screenAuth');
  });
  // signup
  $('btnSignup').addEventListener('click', async ()=>{
    const name=($('inName').value||'').trim().slice(0,20);
    const email=$('inEmail2').value.trim();
    const pass=$('inPass2').value;
    if(!name||!email||!pass){ showToast('すべての項目を入力してください'); return; }
    if(pass.length<6){ showToast('パスワードは6文字以上にしてください'); return; }
    const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{username:name}}});
    if(error){ showToast('登録失敗: '+error.message); return; }
    me=data.user;
    const {error:pErr}=await sb.from('profiles').upsert({id:me.id,username:name},{onConflict:'id'});
    if(pErr) showToast('プロフィール設定失敗: '+pErr.message);
    const {data:prof}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();
    myProfile=prof;
    showOnboarding();
  });
  // onboarding
  $('btnOnboardDone').addEventListener('click', async ()=>{
    if(me) await sb.from('profiles').update({onboarded:true}).eq('id',me.id);
    showScreen('screenFeed'); loadFeed();
  });
  $('btnOnboardSkip').addEventListener('click', async ()=>{
    if(me) await sb.from('profiles').update({onboarded:true}).eq('id',me.id);
    showScreen('screenFeed'); loadFeed();
  });
  // nav
  $('navFeed').addEventListener('click',()=>{
    $('navFeed').classList.add('active'); $('navProfile').classList.remove('active');
    $('navFeed').setAttribute('aria-current','page'); $('navProfile').removeAttribute('aria-current');
    showScreen('screenFeed'); loadFeed();
  });
  $('navProfile').addEventListener('click',()=>{
    $('navProfile').classList.add('active'); $('navFeed').classList.remove('active');
    $('navProfile').setAttribute('aria-current','page'); $('navFeed').removeAttribute('aria-current');
    showScreen('screenProfile'); loadProfile();
  });
  // fab
  $('fabRec').addEventListener('click', startRecording);
  $('btnPostConfirm').addEventListener('click', uploadAndPost);
  $('btnReRecord').addEventListener('click', ()=>{
    if(previewAudio){ previewAudio.pause(); previewAudio=null; }
    previewBlob=null;
    $('recPreview').classList.remove('show');
    $('recTimer').style.display='';
    $('vizCanvas').style.display='';
    $('recProgress').style.display='';
    $('btnStopRec').style.display='';
    $('btnCancelRec').style.display='';
    $('btnPreviewPlay').textContent='再生して確認';
    $('inCaption').value=''; $('captionCounter').textContent='0/50';
    $('recModal').classList.remove('open');
  });
  $('btnStopRec').addEventListener('click', stopRecording);
  $('inCaption').addEventListener('input',()=>{
    const len=$('inCaption').value.length;
    $('captionCounter').textContent=len+'/50';
  });
  $('btnCancelRec').addEventListener('click',()=>{
    clearInterval(recInterval); stopViz();
    if(mediaRecorder&&mediaRecorder.state!=='inactive'){
      mediaRecorder.stop(); mediaRecorder.stream.getTracks().forEach(t=>t.stop());
    }
    $('recModal').classList.remove('open');
    $('inCaption').value='';
    $('captionCounter').textContent='0/50';
    previewBlob=null;
    $('recPreview').classList.remove('show');
    $('recTimer').style.display='';
    $('vizCanvas').style.display='';
    $('recProgress').style.display='';
    $('btnStopRec').style.display='';
    $('btnCancelRec').style.display='';
    $('btnPreviewPlay').textContent='再生して確認';
  });
  // preview play
  $('btnPreviewPlay').addEventListener('click',()=>{
    if(!previewBlob){ showToast('録音データがありません'); return; }
    if(previewAudio){
      previewAudio.pause(); previewAudio=null;
      $('btnPreviewPlay').textContent='再生して確認';
      return;
    }
    const url=URL.createObjectURL(previewBlob);
    previewAudio=new Audio(url);
    previewAudio.play();
    $('btnPreviewPlay').textContent='停止';
    previewAudio.onended=()=>{ previewAudio=null; $('btnPreviewPlay').textContent='再生して確認'; };
  });
  // calendar nav
  $('calPrev').addEventListener('click',()=>{
    calMonth--; if(calMonth<1){calMonth=12;calYear--;}
    renderCalendar(calPostDates);
  });
  $('calNext').addEventListener('click',()=>{
    calMonth++; if(calMonth>12){calMonth=1;calYear++;}
    renderCalendar(calPostDates);
  });
  // profile save
  $('btnSaveProfile').addEventListener('click', async ()=>{
    const name=($('inPName').value||'').trim().slice(0,20);
    const bio=($('inPBio').value||'').trim().slice(0,40);
    if(!name){ showToast('表示名を入力してください'); return; }
    const {error}=await sb.from('profiles').update({username:name,bio,updated_at:new Date().toISOString()}).eq('id',me.id);
    if(error){ showToast('保存失敗: '+error.message); return; }
    myProfile={...myProfile,username:name,bio};
    showToast('保存しました');
    loadProfile();
  });
  // push
  $('btnPushSub').addEventListener('click', subscribePush);
  // show onboarding from profile
  $('btnShowOnboard').addEventListener('click', showOnboarding);
  // friend add
  $('btnAddFriend').addEventListener('click', addFriend);
  // copy invite
  $('btnCopyInvite').addEventListener('click', async ()=>{
    const code=myProfile?.friend_code;
    if(!code){ showToast('フレンドコードがありません'); return; }
    const text=`コエリアルで一緒に声を残そう！\nフレンドコード: ${code}\nhttps://voice-bereal.vercel.app/`;
    try{ await navigator.clipboard.writeText(text); showToast('招待文をコピーしました'); }
    catch(e){ showToast('コピーできませんでした'); }
  });
  // feed refresh
  $('btnRefreshFeed').addEventListener('click', async ()=>{
    const btn=$('btnRefreshFeed');
    btn.disabled=true; btn.textContent='読み込み中';
    await loadFeed();
    btn.disabled=false; btn.textContent='更新';
  });
  // logout
  $('btnLogout').addEventListener('click', async ()=>{
    await sb.auth.signOut(); me=null; myProfile=null;
    showScreen('screenAuth');
  });
  // auth state change
  sb.auth.onAuthStateChange(async (event,session)=>{
    if(event==='PASSWORD_RECOVERY'){
      showScreen('screenReset');
    }
  });
});

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
</script>
</body>
</html>
