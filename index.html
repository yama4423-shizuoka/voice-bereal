<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>コエリアル</title>
  <meta name="description" content="声のBeReal。毎日ランダムな時刻に通知が届き、30秒以内にそのときの声を残す。加工なし、フィルターなし。">
  <meta property="og:title" content="コエリアル - 声のBeReal">
  <meta property="og:description" content="毎日ランダムな時刻に通知が届き、30秒以内にそのときの声を残す。加工なし、フィルターなし。">
  <meta property="og:image" content="https://voice-bereal.vercel.app/ogp.svg">
  <meta property="og:url" content="https://voice-bereal.vercel.app/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://voice-bereal.vercel.app/ogp.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <script>
  (function(){var t=localStorage.getItem('theme');if(t==='light'){document.documentElement.classList.add('light');}else if(!t&&window.matchMedia('(prefers-color-scheme:light)').matches){document.documentElement.classList.add('light');}})();
  </script>
  <link rel="preconnect" href="https://esm.sh">
  <link rel="preconnect" href="https://hbkknijwdppojhzybcit.supabase.co">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{
      --bg:#0a0a0a; --card:#141414; --accent:#e8ff5a; --muted:#666;
      --danger:#ff4d4d; --radius:18px; --safe-bottom:env(safe-area-inset-bottom,0px);
      --text:#fff; --input-bg:#1a1a1a; --input-border:#2a2a2a; --border:#333; --subtle:#222; --nav-bg:rgba(10,10,10,.95);
    }
    html.light{
      --bg:#f5f5f5; --card:#fff; --muted:#666; --text:#0a0a0a;
      --input-bg:#ebebeb; --input-border:#ccc; --border:#bbb; --subtle:#d8d8d8; --nav-bg:rgba(245,245,245,.96);
    }
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overscroll-behavior:none}
    #app{display:flex;flex-direction:column;height:100%;max-width:430px;margin:0 auto}
    /* ---- screens ---- */
    .screen{display:none;flex:1;overflow-y:auto;padding:20px 16px;padding-bottom:calc(160px + var(--safe-bottom))}
    .screen.active{display:block}
    /* ---- auth ---- */
    #screenAuth{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:40px 24px}
    .auth-logo{font-size:2rem;font-weight:900;letter-spacing:-1px}
    .auth-tabs{display:flex;gap:0;background:var(--input-bg);border-radius:12px;padding:4px;width:100%}
    .auth-tab{flex:1;padding:10px;background:none;border:none;color:var(--muted);font-weight:700;font-size:.9rem;border-radius:8px;cursor:pointer;transition:all .2s}
    .auth-tab.active{background:var(--accent);color:#000}
    .auth-form{width:100%;display:flex;flex-direction:column;gap:12px}
    /* ---- inputs ---- */
    input,textarea{width:100%;padding:14px 16px;background:var(--input-bg);border:1px solid var(--input-border);border-radius:12px;color:var(--text);font-size:1rem;font-family:inherit}
    input:focus,textarea:focus{outline:none;border-color:var(--muted)}
    /* ---- buttons ---- */
    .btn{width:100%;padding:15px;border:none;border-radius:14px;font-size:1rem;font-weight:700;cursor:pointer;transition:opacity .15s;font-family:inherit}
    .btn-primary{background:var(--accent);color:#000}
    .btn-ghost{background:none;border:1px solid var(--input-border);color:var(--text)}
    .btn:active{opacity:.7}
    .btn:disabled{opacity:.4;cursor:default}
    /* ---- feed ---- */
    .feed-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
    .feed-title{font-size:1.1rem;font-weight:800}
    #refreshBtn{background:none;border:1px solid var(--input-border);color:var(--muted);border-radius:10px;padding:6px 14px;font-size:.78rem;font-weight:700;cursor:pointer}
    #refreshBtn:active{opacity:.7}
    .post-card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px}
    .post-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
    .avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#000;font-weight:900;font-size:1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .post-name{font-weight:700;font-size:.95rem}
    .post-time{font-size:.75rem;color:var(--muted)}
    .post-bio{font-size:.72rem;color:var(--muted);margin-top:2px}
    .post-caption{font-size:.875rem;color:#ccc;margin-top:8px;line-height:1.4}
    .play-row{display:flex;align-items:center;gap:10px}
    .play-btn{width:44px;height:44px;border-radius:50%;background:var(--accent);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
    .play-btn svg{width:22px;height:22px;fill:#000}
    .play-btn:active{opacity:.7}
    .waveform{flex:1;height:36px;background:var(--input-bg);border-radius:8px;overflow:hidden;position:relative;cursor:pointer}
    .waveform-progress{height:100%;background:var(--accent);opacity:.3;width:0%;transition:width .1s linear}
    .duration-label{font-size:.75rem;color:var(--muted);flex-shrink:0}
    .speed-btn{background:var(--subtle);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:4px 8px;font-size:.75rem;font-weight:700;cursor:pointer;flex-shrink:0}
    .speed-btn:active{opacity:.7}
    .reaction-row{display:flex;align-items:center;gap:8px;margin-top:10px}
    .reaction-btn{background:var(--input-bg);border:1px solid var(--input-border);border-radius:20px;color:var(--muted);font-size:.78rem;font-weight:600;padding:5px 12px;cursor:pointer;transition:all .2s}
    .reaction-btn.reacted{background:#2a2a1a;border-color:var(--accent);color:var(--accent)}
    .post-card.listened{opacity:.72}
    .bookmark-btn{background:var(--input-bg);border:1px solid var(--input-border);border-radius:20px;color:var(--muted);font-size:.78rem;font-weight:600;padding:5px 12px;cursor:pointer;transition:all .2s;margin-left:auto}
    .bookmark-btn.bookmarked{background:#0a1a2a;border-color:#5aa8e8;color:#5aa8e8}
    .cmt-count{font-size:.72rem;color:var(--muted);padding:5px 4px;white-space:nowrap}
    .comment-section{margin-top:10px;padding-top:10px;border-top:1px solid var(--subtle)}
    .comment-item{font-size:.78rem;color:#ccc;margin-bottom:5px;line-height:1.4}
    .comment-name{font-weight:700;color:var(--muted);margin-right:4px}
    .comment-form{display:flex;gap:6px;margin-top:8px}
    .comment-form input{flex:1;padding:7px 10px;font-size:.78rem;border-radius:10px}
    .comment-send{width:auto!important;padding:7px 12px;font-size:.75rem;font-weight:700;border-radius:10px;background:var(--input-bg);border:1px solid var(--input-border);color:var(--muted);cursor:pointer;flex-shrink:0}
    .comment-send:active{opacity:.7}
    .comment-del{background:none;border:none;color:var(--muted);font-size:.7rem;cursor:pointer;padding:0 0 0 6px;vertical-align:middle;opacity:.5;line-height:1}
    .comment-del:hover{opacity:1;color:#e55}
    .on-time-badge{background:#1a2a00;border:1px solid var(--accent);color:var(--accent);border-radius:10px;padding:2px 8px;font-size:.7rem;font-weight:700}
    .streak-banner{background:#1a2a00;border:1px solid var(--accent);border-radius:14px;padding:12px 16px;margin-bottom:16px;text-align:center;font-weight:700;font-size:.95rem;color:var(--accent)}
    .silent-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
    .silent-chip{background:var(--card);border:1px solid var(--input-border);border-radius:20px;padding:4px 12px;font-size:.78rem;color:var(--muted)}
    .tag-selector{display:flex;gap:6px;flex-wrap:wrap;width:80%;justify-content:center;margin-top:4px}
    .tag-btn{background:var(--input-bg);border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:6px 14px;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s}
    .tag-btn.selected{background:#1a2a00;border-color:var(--accent);color:var(--accent)}
    .post-tag{display:inline-block;background:#1a2a00;border:1px solid #2a3a00;color:#9ab83c;border-radius:8px;padding:2px 8px;font-size:.7rem;font-weight:600;margin-top:6px}
    .feed-tag-btn{background:var(--input-bg);border:1px solid var(--input-border);border-radius:20px;color:var(--muted);font-size:.75rem;font-weight:600;padding:4px 12px;cursor:pointer;transition:all .2s}
    .feed-tag-btn.selected{background:#1a2a00;border-color:var(--accent);color:var(--accent)}
    /* ---- rec modal ---- */
    #recModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:100;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
    #recModal.open{display:flex}
    .rec-timer{font-size:3rem;font-weight:900;letter-spacing:-2px}
    .rec-bar{width:80%;height:6px;background:var(--subtle);border-radius:3px;overflow:hidden}
    .rec-bar-fill{height:100%;background:var(--accent);width:0%;transition:width .5s linear}
    .rec-caption-wrap{width:80%}
    .rec-caption-wrap input{background:var(--input-bg);border:1px solid var(--border)}
    .rec-caption-counter{font-size:.75rem;color:var(--muted);text-align:right;margin-top:4px}
    /* visualizer */
    #vizCanvas{width:80%;height:48px;border-radius:8px;background:var(--input-bg)}
    /* ---- profile ---- */
    .profile-header{display:flex;align-items:center;gap:16px;margin-bottom:24px}
    .avatar-lg{width:64px;height:64px;border-radius:50%;background:var(--accent);color:#000;font-weight:900;font-size:1.6rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .profile-name{font-size:1.2rem;font-weight:800}
    .profile-code{font-size:.75rem;color:var(--muted);font-weight:600;margin-top:2px}
    .profile-bio{font-size:.85rem;color:#aaa;margin-top:4px}
    .section-label{font-size:.75rem;color:var(--muted);font-weight:700;margin:20px 0 10px;letter-spacing:.05em}
    details.yesterday-section>summary{cursor:pointer;list-style:none;display:block}
    details.yesterday-section>summary::-webkit-details-marker{display:none}
    .play-all-btn{background:var(--input-bg);border:1px solid var(--input-border);border-radius:20px;color:var(--muted);font-size:.78rem;font-weight:600;padding:5px 14px;cursor:pointer;transition:all .2s;margin-bottom:12px}
    .play-all-btn.active{background:#1a2a1a;border-color:var(--accent);color:var(--accent)}
    .profile-stat{font-size:.85rem;color:#aaa;margin-bottom:8px}
    /* ---- calendar ---- */
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
    .cal-day{aspect-ratio:1;border-radius:8px;background:var(--input-bg);display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--muted)}
    .cal-day.posted{background:var(--accent);color:#000;font-weight:700;cursor:pointer}
    .cal-day.empty{background:transparent}
    /* ---- friends ---- */
    .friend-card{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
    .friend-info{display:flex;align-items:center;gap:10px}
    .friend-name{font-weight:700;font-size:.95rem}
    .friend-status{font-size:.65rem;border-radius:8px;padding:2px 7px;margin-top:3px;display:inline-block}
    .friend-status.posted{background:#1a2a00;border:1px solid var(--accent);color:var(--accent)}
    .friend-status.not-posted{background:var(--input-bg);color:var(--muted)}
    /* ---- friend archive modal ---- */
    #friendArchiveModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;align-items:flex-end;justify-content:center}
    #friendArchiveModal.open{display:flex}
    #friendArchiveInner{background:var(--bg);border-radius:20px 20px 0 0;padding:24px 16px;width:100%;max-width:430px;max-height:80vh;overflow-y:auto;border-top:1px solid var(--subtle)}
    /* ---- preview ---- */
    #recPreview{display:none;flex-direction:column;gap:10px;width:80%}
    #recPreview.show{display:flex}
    /* ---- toast ---- */
    #toast{position:fixed;bottom:calc(90px + var(--safe-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--subtle);border:1px solid var(--border);border-radius:12px;padding:10px 20px;font-size:.875rem;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap;z-index:200}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    /* ---- record fab ---- */
    #fabRec{position:fixed;bottom:calc(72px + var(--safe-bottom));left:50%;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(232,255,90,.3);z-index:10}
    #fabRec svg{width:28px;height:28px;fill:#000}
    #fabRec:active{transform:translateX(-50%) scale(.92)}
    /* ---- nav ---- */
    nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--nav-bg);backdrop-filter:blur(10px);border-top:1px solid var(--input-bg);display:flex;justify-content:space-around;padding:8px 0;padding-bottom:calc(8px + var(--safe-bottom));z-index:10}
    .nav-btn{position:relative;background:none;border:none;color:var(--muted);font-size:.65rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 16px;cursor:pointer;transition:color .15s}
    .nav-badge{position:absolute;top:2px;right:4px;background:var(--danger);color:#fff;border-radius:50%;font-size:.55rem;font-weight:900;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;pointer-events:none}
    .nav-btn.active,.nav-btn:focus-visible{color:var(--text)}
    .nav-btn svg{width:22px;height:22px}
    /* ---- push setup ---- */
    .push-card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:16px}
    /* ---- reset screen ---- */
    #screenReset{align-items:stretch}
  </style>
</head>
<body>
<div id="app" role="main">

<!-- ====== AUTH ====== -->
<section id="screenAuth" class="screen active" aria-label="ログイン・登録">
  <p class="auth-logo" aria-label="コエリアル">コエリアル</p>
  <p style="color:var(--muted);font-size:.85rem;text-align:center">声のBeReal。毎日ランダムな時刻に<br>そのときの声を残そう。</p>
  <div class="auth-tabs" role="tablist">
    <button id="tabLogin" class="auth-tab active" role="tab" aria-selected="true" aria-controls="formLogin">ログイン</button>
    <button id="tabSignup" class="auth-tab" role="tab" aria-selected="false" aria-controls="formSignup">新規登録</button>
  </div>
  <form id="formLogin" class="auth-form" aria-label="ログインフォーム">
    <input id="loginEmail" type="email" placeholder="メールアドレス" autocomplete="email" aria-label="メールアドレス" required>
    <input id="loginPass" type="password" placeholder="パスワード" autocomplete="current-password" aria-label="パスワード" required>
    <button class="btn btn-primary" type="submit">ログイン</button>
    <button type="button" class="btn btn-ghost" id="forgotBtn" style="font-size:.85rem;padding:10px">パスワードを忘れた場合</button>
  </form>
  <form id="formSignup" class="auth-form" style="display:none" aria-label="新規登録フォーム">
    <input id="signupEmail" type="email" placeholder="メールアドレス" autocomplete="email" aria-label="メールアドレス" required>
    <input id="signupPass" type="password" placeholder="パスワード(6文字以上)" autocomplete="new-password" aria-label="パスワード" required>
    <input id="signupName" type="text" placeholder="表示名(あとで変更可)" maxlength="20" aria-label="表示名" required>
    <button class="btn btn-primary" type="submit">登録する</button>
  </form>
</section>

<!-- ====== ONBOARDING ====== -->
<section id="screenOnboard" class="screen" aria-label="はじめかた">
  <h2 style="font-size:1.2rem;font-weight:800;margin-bottom:8px">コエリアルへようこそ</h2>
  <p style="color:var(--muted);font-size:.85rem;margin-bottom:24px">3ステップでかんたん設定</p>
  <div style="display:flex;flex-direction:column;gap:16px;margin-bottom:32px">
    <div class="push-card">
      <p style="font-weight:700;margin-bottom:6px">1. ホーム画面に追加</p>
      <div id="onboardInstallText" style="font-size:.85rem;color:#aaa;line-height:1.6"></div>
    </div>
    <div class="push-card">
      <p style="font-weight:700;margin-bottom:6px">2. 通知をオン</p>
      <p style="font-size:.85rem;color:#aaa;line-height:1.6">毎日ランダムな時刻に「いまの声を残そう」と通知が届きます。</p>
      <button class="btn btn-primary" id="onboardPushBtn" style="margin-top:12px">通知を許可する</button>
    </div>
    <div class="push-card">
      <p style="font-weight:700;margin-bottom:6px">3. フレンドを追加</p>
      <p style="font-size:.85rem;color:#aaa;line-height:1.6">プロフィール画面でフレンドコードを共有して、お互いの声を聴き合おう。</p>
    </div>
  </div>
  <button class="btn btn-ghost" id="onboardSkipBtn">スキップしてはじめる</button>
</section>

<!-- ====== RESET PASSWORD ====== -->
<section id="screenReset" class="screen" style="display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:16px;padding:40px 24px" aria-label="パスワード再設定">
  <h2 style="font-size:1.2rem;font-weight:800">パスワードを再設定</h2>
  <form id="formReset" style="display:flex;flex-direction:column;gap:12px">
    <input id="resetPass" type="password" placeholder="新しいパスワード(6文字以上)" autocomplete="new-password" aria-label="新しいパスワード" required>
    <button class="btn btn-primary" type="submit">パスワードを変更する</button>
  </form>
</section>

<!-- ====== FEED ====== -->
<section id="screenFeed" class="screen" aria-label="フィード" aria-live="polite">
  <div class="feed-header">
    <h2 class="feed-title">きょうの声</h2>
    <button id="refreshBtn" aria-label="フィードを更新">更新</button>
  </div>
  <div id="todayBadge" style="margin-bottom:12px" aria-live="polite"></div>
  <div id="streakBanner"></div>
  <div id="feedTagFilter" style="display:none;flex-wrap:wrap;gap:6px;margin-bottom:12px" role="group" aria-label="タグで絞り込む">
    <button class="feed-tag-btn selected" data-ftag="">全て</button>
    <button class="feed-tag-btn" data-ftag="朝">朝</button>
    <button class="feed-tag-btn" data-ftag="夜">夜</button>
    <button class="feed-tag-btn" data-ftag="ひとりごと">ひとりごと</button>
    <button class="feed-tag-btn" data-ftag="仕事中">仕事中</button>
  </div>
  <div id="feedList"></div>
</section>

<!-- ====== PROFILE ====== -->
<section id="screenProfile" class="screen" aria-label="プロフィール">
  <div class="profile-header">
    <div class="avatar-lg" id="profileAvatar" aria-hidden="true">?</div>
    <div>
      <p class="profile-name" id="profileName"></p>
      <p class="profile-code" id="profileCode"></p>
      <p class="profile-bio" id="profileBio"></p>
    </div>
  </div>
  <form id="formProfile" style="display:flex;flex-direction:column;gap:10px;margin-bottom:24px" aria-label="プロフィール編集">
    <input id="inputName" type="text" placeholder="表示名" maxlength="20" aria-label="表示名">
    <textarea id="inputBio" placeholder="ひとこと(40文字以内)" maxlength="40" rows="2" style="resize:none" aria-label="ひとこと"></textarea>
    <button class="btn btn-primary" type="submit">保存</button>
  </form>
  <p class="section-label">投稿統計</p>
  <div id="profileStats"></div>
  <p class="section-label">投稿カレンダー</p>
  <div id="calContainer"></div>
  <p id="calCaption" style="font-size:.82rem;color:#aaa;margin-top:4px;display:none"></p>
  <p class="section-label">最近のリアクション</p>
  <div id="reactionNotifs"></div>
  <p class="section-label">最近のコメント</p>
  <div id="commentNotifs"></div>
  <p class="section-label">ブックマーク</p>
  <div id="bookmarkList"></div>
  <p class="section-label">フレンド</p>
  <div id="friendSection">
    <input id="friendCodeInput" type="text" placeholder="フレンドコードを入力" maxlength="8" style="margin-bottom:8px;text-transform:uppercase" aria-label="フレンドコードを入力">
    <button class="btn btn-ghost" id="addFriendBtn" style="margin-bottom:16px">フレンドに追加</button>
    <button class="btn btn-ghost" id="copyInviteBtn" style="margin-bottom:16px">招待テキストをコピー</button>
    <div id="friendList"></div>
  </div>
  <p class="section-label">設定</p>
  <div style="display:flex;flex-direction:column;gap:10px">
    <button class="btn btn-ghost" id="themeToggleBtn">テーマ: ダーク</button>
    <button class="btn btn-ghost" id="pushSetupBtn">通知の設定</button>
    <button class="btn btn-ghost" id="onboardAgainBtn">はじめかたを見る</button>
    <button class="btn btn-ghost" id="logoutBtn">ログアウト</button>
  </div>
</section>

<!-- ====== PUSH SETUP ====== -->
<section id="screenPush" class="screen" aria-label="通知設定">
  <h2 style="font-size:1.1rem;font-weight:800;margin-bottom:16px">通知の設定</h2>
  <div id="pushContent"></div>
</section>

// ---- daily minutes (same for all users per day) ----
function dailyMinutes(){
  const today=todayJST();
  let h=0;
  for(let i=0;i<today.length;i++) h=(h*31+today.charCodeAt(i))>>>0;
  return 660+(h%(60*10)); // 11:00(660) to 21:00(1260)
}
function showTodayBadge(){
  const mins=dailyMinutes();
  const h=Math.floor(mins/60), m=mins%60;
  const timeStr=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  $('todayBadge').innerHTML=`<p style="font-size:.78rem;color:var(--muted)">本日のお題時刻: <strong style="color:#fff">${timeStr}</strong> (±60分以内でバッジ付与)</p>`;

// ---- streak ----
async function showStreak(){
  const {data}=await sb.from('posts').select('post_date').eq('user_id',me.id).order('post_date',{ascending:false}).limit(60);
  if(!data||data.length<3){$('streakBanner').innerHTML='';return;}
  const dates=data.map(p=>p.post_date);
  const today=todayJST();
  let streak=0, cur=today;
  for(let i=0;i<dates.length;i++){
    if(dates[i]===cur){ streak++; const d=new Date(cur); d.setDate(d.getDate()-1); cur=d.toISOString().slice(0,10); }
    else if(dates[i]<cur) break;
  }
  if(streak>=3){
    $('streakBanner').innerHTML=`<div class="streak-banner">${streak}日連続で声を残しています</div>`;
  } else {
    $('streakBanner').innerHTML='';
  }
}

    currentAudio.pause(); currentAudio=null;
    if(currentBtn)currentBtn.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
    if(currentWave)currentWave.style.width='0%';
    if(currentBtn===btn){currentBtn=null;currentWave=null;return;}
  }
  sb.storage.from('voice-posts').createSignedUrl(path,60).then(({data})=>{
    if(!data?.signedUrl) return;
    const audio=new Audio(data.signedUrl);
    audio.playbackRate=speed;
    if(seekTo!==undefined) audio.addEventListener('loadedmetadata',()=>{audio.currentTime=seekTo;},{once:true});
    currentAudio=audio; currentBtn=btn; currentWave=wave;
    btn.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
    audio.play();
    const interval=setInterval(()=>{
      if(!audio.paused) wave.style.width=(audio.currentTime/dur*100)+'%';
    },100);
    audio.onended=()=>{
      clearInterval(interval); wave.style.width='0%';
      btn.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
      const rxBtn=btn.closest('.post-card')?.querySelector('.reaction-btn[data-pid]');
      if(rxBtn&&!rxBtn.classList.contains('reacted')) toggleReaction(rxBtn);
      currentAudio=null; currentBtn=null; currentWave=null;
      if(autoPlayQueue.length){ const nb=autoPlayQueue.shift(); playPost(nb); }
      else{ const pab=$('feedList')?.querySelector('.play-all-btn'); if(pab){pab.textContent='全部聴く';pab.classList.remove('active');} }
    };
  });
}

function cycleSpeed(btn){
  const speeds=[0.75,1,1.5];
  const cur=parseFloat(btn.textContent.replace('x','')||'1');
  const next=speeds[(speeds.indexOf(cur)+1)%speeds.length];
  btn.textContent='x'+next;
  const card=btn.closest('.post-card');
  const playBtn=card.querySelector('.play-btn');
  if(currentBtn===playBtn && currentAudio) currentAudio.playbackRate=next;
}

async function toggleReaction(btn){
  const pid=btn.dataset.pid;
  const reacted=btn.classList.contains('reacted');
  let cnt=parseInt(btn.dataset.rx||'0');
  if(reacted){
    await sb.from('reactions').delete().eq('user_id',me.id).eq('post_id',pid);
    cnt=Math.max(0,cnt-1);
    btn.dataset.rx=cnt;
    btn.classList.remove('reacted');
    btn.textContent=cnt>0?`聴いたよ ${cnt}`:'聴いたよ';
    btn.setAttribute('aria-pressed','false');
  } else {
    const {error}=await sb.from('reactions').insert({user_id:me.id,post_id:pid});
    if(!error||error.code==='23505'){
      cnt+=1; btn.dataset.rx=cnt;
      btn.classList.add('reacted');
      btn.textContent=cnt>0?`聴いたよ済み ${cnt}`:'聴いたよ済み';
      btn.setAttribute('aria-pressed','true');
    } else showToast('エラー: '+error.message);
  }
}

async function toggleBookmark(btn){
  const pid=btn.dataset.bm;
  const bookmarked=btn.classList.contains('bookmarked');
  if(bookmarked){
    const {error}=await sb.from('bookmarks').delete().eq('user_id',me.id).eq('post_id',pid);
    if(error&&error.code!=='42P01'){showToast('解除失敗: '+error.message);return;}

async function submitComment(postId){

async function deleteComment(commentId,postId){

// ---- calendar ----
let calYear=null, calMonth=null, calPostDates=[];
function renderCalendar(posts){
  const now=new Date();
  if(calYear===null){ calYear=now.getFullYear(); calMonth=now.getMonth()+1; }
  calPostDates=posts||[];
  const container=$('calContainer'); container.innerHTML='';
  // month nav
  const nav=document.createElement('div');
  nav.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-bottom:10px';
  const prev=document.createElement('button'); prev.textContent='<'; prev.className='btn btn-ghost';
  prev.style.cssText='width:auto;padding:4px 12px'; prev.setAttribute('aria-label','前の月');
  prev.onclick=()=>{ calMonth--; if(calMonth<1){calMonth=12;calYear--;} renderCalendar(calPostDates); };
  const next=document.createElement('button'); next.textContent='>'; next.className='btn btn-ghost';
  next.style.cssText='width:auto;padding:4px 12px'; next.setAttribute('aria-label','次の月');
  next.onclick=()=>{ calMonth++; if(calMonth>12){calMonth=1;calYear++;} renderCalendar(calPostDates); };
  const label=document.createElement('p'); label.textContent=`${calYear}年${calMonth}月`; label.style.fontWeight='700';
  nav.appendChild(prev); nav.appendChild(label); nav.appendChild(next);
  container.appendChild(nav);
  // grid
  const grid=document.createElement('div'); grid.className='cal-grid';
  const firstDay=new Date(calYear,calMonth-1,1).getDay();
  const daysInMonth=new Date(calYear,calMonth,0).getDate();
  for(let i=0;i<firstDay;i++){ const e=document.createElement('div'); e.className='cal-day empty'; grid.appendChild(e); }
  const postDateSet=new Set(posts.map(p=>p.post_date||p.created_at?.slice(0,10)));
  for(let d=1;d<=daysInMonth;d++){
    const cell=document.createElement('div'); cell.className='cal-day';
    const dateStr=`${calYear}-${String(calMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if(postDateSet.has(dateStr)){ cell.classList.add('posted'); cell.setAttribute('role','button'); cell.setAttribute('tabindex','0'); cell.setAttribute('aria-label',`${calMonth}月${d}日の声を再生`); cell.onclick=()=>playCalDay(calYear,calMonth,d); cell.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')playCalDay(calYear,calMonth,d);}; }
    cell.textContent=d; grid.appendChild(cell);
  }
  container.appendChild(grid);
}
async function playCalDay(yr,mo,day){
  const dateStr=`${yr}-${String(mo).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  const post=calPostDates.find(p=>(p.post_date||p.created_at?.slice(0,10))===dateStr);
  if(!post) return;
  const capEl=$('calCaption');
  if(post.caption){ capEl.textContent=post.caption; capEl.style.display=''; }
  else { capEl.style.display='none'; }
  const {data}=await sb.storage.from('voice-posts').createSignedUrl(post.storage_path,60);
  if(!data?.signedUrl){ showToast('再生できませんでした'); return; }
  if(currentAudio){ currentAudio.pause(); currentAudio=null; }
  const audio=new Audio(data.signedUrl);
  currentAudio=audio;
  audio.play();
  showToast(`${mo}月${day}日の声を再生中`);
  audio.onended=()=>{ currentAudio=null; };
}

// ---- profile stats ----
function calcLongestStreak(posts){
  if(!posts||!posts.length) return 0;
  const dates=[...new Set(posts.map(p=>p.post_date||p.created_at?.slice(0,10)))].sort();
  if(!dates.length) return 0;
  let max=1,cur=1;
  for(let i=1;i<dates.length;i++){
    const diff=(new Date(dates[i])-new Date(dates[i-1]))/86400000;
    if(diff===1){cur++;if(cur>max)max=cur;}else cur=1;
  }
  return max;
}
function renderProfileStats(posts){
  const total=posts?posts.length:0;
  const longest=calcLongestStreak(posts);
  $('profileStats').innerHTML=
    `<div style="display:flex;gap:12px;margin-bottom:4px">
      <div style="flex:1;background:var(--card);border-radius:12px;padding:14px;text-align:center">
        <p style="font-size:1.6rem;font-weight:900;color:var(--accent)">${total}</p>
        <p style="font-size:.72rem;color:var(--muted);margin-top:4px">合計投稿数</p>
      </div>
      <div style="flex:1;background:var(--card);border-radius:12px;padding:14px;text-align:center">
        <p style="font-size:1.6rem;font-weight:900;color:var(--accent)">${longest}</p>
        <p style="font-size:.72rem;color:var(--muted);margin-top:4px">最長連続日数</p>
      </div>
    </div>`;
}

async function loadPushScreen(){

    el.innerHTML='<p style="color:var(--muted)">このブラウザはプッシュ通知に対応していません。</p>'; return;
  }

    await ensurePushSubscription();
  } else if(perm==='denied'){
    el.innerHTML=`<div class="push-card"><p style="font-weight:700;margin-bottom:8px">通知がブロックされています</p><p style="font-size:.85rem;color:#aaa">ブラウザの設定から通知を許可してください。</p></div>`;
  } else {
    el.innerHTML=`<div class="push-card"><p style="font-weight:700;margin-bottom:8px">通知を有効にする</p><p style="font-size:.85rem;color:#aaa;margin-bottom:16px">毎日ランダムな時刻に「いまの声を残そう」と通知が届きます。</p><button class="btn btn-primary" id="requestPushBtn">通知を許可する</button></div>`;
    $('requestPushBtn')?.addEventListener('click', async ()=>{
      const result=await Notification.requestPermission();
      if(result==='granted'){ await ensurePushSubscription(); loadPushScreen(); showToast('通知を有効にしました'); }

async function ensurePushSubscription(){
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub){
      const vapidKey='BPmwqM7bFPuT1cBKyMlAmHyE--G-0GgLScnNdwEhGPMrIhqF1qsKyVUn6JwdRwsF3Y0K2cGr7rdDXz5T-jh78PM';
      const appKey=Uint8Array.from(atob(vapidKey.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
      sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:appKey});
    }
    const subJson=sub.toJSON();
    await sb.from('push_subscriptions').upsert({user_id:me.id,endpoint:subJson.endpoint,p256dh:subJson.keys?.p256dh,auth:subJson.keys?.auth},{onConflict:'endpoint'});
  }catch(e){ console.warn('push subscription failed',e); }
}

// ---- recording ----
let mediaRec=null, audioChunks=[], recInterval=null, vizAnim=null, vizStream=null, selectedTag=null;

async function startRec(){
  if(!navigator.mediaDevices){ showToast('このブラウザは録音に対応していません'); return; }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    vizStream=stream;
    const mime=MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':'audio/mp4';
    mediaRec=new MediaRecorder(stream,{mimeType:mime});
    audioChunks=[];
    mediaRec.ondataavailable=e=>audioChunks.push(e.data);
    mediaRec.start();
    $('recModal').classList.add('open');
    $('recPreview').classList.remove('show');
    $('recStopBtn').style.display='';
    $('recCaption').value='';
    $('recCaptionCounter').textContent='0 / 50';
    selectedTag=null;
    $('tagSelector').querySelectorAll('.tag-btn').forEach(b=>{b.classList.remove('selected');b.setAttribute('aria-pressed','false');});
    let elapsed=0;
    recInterval=setInterval(()=>{
      elapsed++;
      $('recTimer').textContent=elapsed+'s';
      $('recBarFill').style.width=(elapsed/30*100)+'%';
      $('recBarFill').closest('[role=progressbar]')?.setAttribute('aria-valuenow',elapsed);
      if(elapsed>=30){ stopRec(); }
    },1000);
    // visualizer
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const src=ctx.createMediaStreamSource(stream);
    const analyser=ctx.createAnalyser(); analyser.fftSize=64;
    src.connect(analyser);
    const buf=new Uint8Array(analyser.frequencyBinCount);
    const canvas=$('vizCanvas'); const cctx=canvas.getContext('2d');
    canvas.width=canvas.offsetWidth||300; canvas.height=48;
    function drawViz(){
      vizAnim=requestAnimationFrame(drawViz);
      analyser.getByteFrequencyData(buf);
      cctx.clearRect(0,0,canvas.width,canvas.height);
      const bw=canvas.width/buf.length;
      buf.forEach((v,i)=>{
        const h=v/255*canvas.height;
        cctx.fillStyle='#e8ff5a';
        cctx.fillRect(i*bw,canvas.height-h,bw-1,h);
      });
    }
    drawViz();
  } catch(e){
    showToast('マイクへのアクセスが必要です');
  }
}

function stopRec(){
  clearInterval(recInterval);
  if(vizAnim){ cancelAnimationFrame(vizAnim); vizAnim=null; }
  if(vizStream){ vizStream.getTracks().forEach(t=>t.stop()); vizStream=null; }
  if(mediaRec&&mediaRec.state!=='inactive'){
    mediaRec.stop();
    mediaRec.onstop=()=>{
      const blob=new Blob(audioChunks,{type:mediaRec.mimeType});
      const url=URL.createObjectURL(blob);
      const prev=$('previewAudio');
      prev.src=url;
      $('recPreview').classList.add('show');
      $('recStopBtn').style.display='none';
    };
  }
}

async function submitRecording(){
  const blob=new Blob(audioChunks,{type:mediaRec?.mimeType||'audio/webm'});
  const ext=blob.type.includes('mp4')?'mp4':'webm';
  const path=`${me.id}/${Date.now()}.${ext}`;
  const caption=$('recCaption').value.trim();
  const today=todayJST();
  const {error:upErr}=await sb.storage.from('voice-posts').upload(path,blob);
  if(upErr){ showToast('アップロード失敗: '+upErr.message); return; }
  const dur=parseInt($('recTimer').textContent)||0;
  const insertData={user_id:me.id,storage_path:path,duration_sec:dur,caption,post_date:today};
  if(selectedTag) insertData.tag=selectedTag;
  let {error:dbErr}=await sb.from('posts').insert(insertData);
  if(dbErr&&selectedTag&&(dbErr.message?.includes('tag')||dbErr.code==='42703')){
    delete insertData.tag;
    const r2=await sb.from('posts').insert(insertData); dbErr=r2.error;
  }
  if(dbErr){
    sb.storage.from('voice-posts').remove([path]);
    showToast('投稿失敗: '+dbErr.message); return;
  }
  $('recModal').classList.remove('open');
  showToast('投稿しました');
  loadFeed();
}

let archivePosts=[],archCalYear=null,archCalMonth=null;
async function openFriendArchive(friendId,name){

  archivePosts=data;

function renderArchiveCal(){
  const now=new Date();
  if(archCalYear===null){archCalYear=now.getFullYear();archCalMonth=now.getMonth()+1;}
  const container=$('friendArchiveCal');container.innerHTML='';
  const nav=document.createElement('div');nav.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-bottom:10px';
  const prev=document.createElement('button');prev.textContent='<';prev.className='btn btn-ghost';prev.style.cssText='width:auto;padding:4px 12px';prev.setAttribute('aria-label','前の月');
  prev.onclick=()=>{archCalMonth--;if(archCalMonth<1){archCalMonth=12;archCalYear--;}renderArchiveCal();};
  const next=document.createElement('button');next.textContent='>';next.className='btn btn-ghost';next.style.cssText='width:auto;padding:4px 12px';next.setAttribute('aria-label','次の月');
  next.onclick=()=>{archCalMonth++;if(archCalMonth>12){archCalMonth=1;archCalYear++;}renderArchiveCal();};
  const lbl=document.createElement('p');lbl.textContent=`${archCalYear}年${archCalMonth}月`;lbl.style.fontWeight='700';
  nav.appendChild(prev);nav.appendChild(lbl);nav.appendChild(next);container.appendChild(nav);
  const grid=document.createElement('div');grid.className='cal-grid';
  const firstDay=new Date(archCalYear,archCalMonth-1,1).getDay();
  const daysInMonth=new Date(archCalYear,archCalMonth,0).getDate();
  for(let i=0;i<firstDay;i++){const e=document.createElement('div');e.className='cal-day empty';grid.appendChild(e);}
  const postDateSet=new Set(archivePosts.map(p=>p.post_date||p.created_at?.slice(0,10)));
  for(let d=1;d<=daysInMonth;d++){
    const cell=document.createElement('div');cell.className='cal-day';
    const dateStr=`${archCalYear}-${String(archCalMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if(postDateSet.has(dateStr)){
      cell.classList.add('posted');cell.setAttribute('role','button');cell.setAttribute('tabindex','0');
      cell.setAttribute('aria-label',`${archCalMonth}月${d}日の声を再生`);
      cell.onclick=()=>playArchiveDay(dateStr);
      cell.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')playArchiveDay(dateStr);};
    }
    cell.textContent=d;grid.appendChild(cell);
  }
  container.appendChild(grid);
}
async function playArchiveDay(dateStr){
  const post=archivePosts.find(p=>(p.post_date||p.created_at?.slice(0,10))===dateStr);
  if(!post) return;
  const capEl=$('friendArchiveCaption');
  if(post.caption){capEl.textContent=post.caption;capEl.style.display='';}
  else capEl.style.display='none';
  const {data}=await sb.storage.from('voice-posts').createSignedUrl(post.storage_path,60);
  if(!data?.signedUrl){showToast('再生できませんでした');return;}
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  const audio=new Audio(data.signedUrl);
  currentAudio=audio;audio.play();
  const [,m,d]=dateStr.split('-');
  showToast(`${parseInt(m)}月${parseInt(d)}日の声を再生中`);
  audio.onended=()=>{currentAudio=null;};
}

async function updateReactionBadge(){
  if(!me) return;
  const rxLastSeen=localStorage.getItem('rx_seen_'+me.id)||'2000-01-01T00:00:00Z';
  const cmtLastSeen=localStorage.getItem('cmt_seen_'+me.id)||'2000-01-01T00:00:00Z';
  const {data:posts}=await sb.from('posts').select('id').eq('user_id',me.id).limit(200);
  const badge=$('reactionBadge');
  if(!badge) return;
  if(!posts||!posts.length){badge.style.display='none';return;}
  const ids=posts.map(p=>p.id);
  const [{count:rxCount},{count:cmtCount}]=await Promise.all([
    sb.from('reactions').select('id',{count:'exact',head:true}).in('post_id',ids).gt('created_at',rxLastSeen),
    sb.from('comments').select('id',{count:'exact',head:true}).in('post_id',ids).neq('user_id',me.id).gt('created_at',cmtLastSeen)
  ]);
  const total=(rxCount||0)+(cmtCount||0);
  if(total>0){badge.textContent=total>9?'9+':String(total);badge.style.display='flex';}
  else badge.style.display='none';
}
function clearReactionBadge(){
  if(!me) return;
  const now=new Date().toISOString();
  localStorage.setItem('rx_seen_'+me.id,now);
  localStorage.setItem('cmt_seen_'+me.id,now);
  const badge=$('reactionBadge');if(badge)badge.style.display='none';
}

  b.textContent='フレンドの新しい声が'+cnt+'件とどいたよ (タップして更新)';
  b.style.cssText='background:var(--accent);color:#fff;text-align:center;padding:10px 16px;font-size:.88rem;cursor:pointer;';
  b.addEventListener('click',()=>{b.remove();loadFeed();});
  const fl=$('feedList');
  fl.parentElement.insertBefore(b,fl);
}
async function startFeedPoller(){
  stopFeedPoller();
  if(!me||!feedFriendIds.length)return;
  feedPollInterval=setInterval(async()=>{
    if(document.hidden||!$('screenFeed').classList.contains('active'))return;
    if($('newPostsBanner'))return;
    const today=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});
    const{count}=await sb.from('friend_feed')
      .select('id',{count:'exact',head:true})
      .eq('post_date',today)
      .gt('created_at',feedLastLoadedAt);
    if(count>0)showNewPostsBanner(count);
  },60000);
}

// ---- theme ----
function applyTheme(t){
  document.documentElement.classList.toggle('light',t==='light');
  const btn=$('themeToggleBtn');
  if(btn) btn.textContent='テーマ: '+(t==='light'?'ライト':'ダーク');
}
(function syncThemeBtn(){
  const btn=$('themeToggleBtn');
  if(btn) btn.textContent='テーマ: '+(document.documentElement.classList.contains('light')?'ライト':'ダーク');
})();
$('themeToggleBtn').addEventListener('click',()=>{
  const next=document.documentElement.classList.contains('light')?'dark':'light';
  localStorage.setItem('theme',next);
  applyTheme(next);
});

// ---- auth state ----
sb.auth.onAuthStateChange(async (event,session)=>{
  if(event==='PASSWORD_RECOVERY'){
    showScreen('screenReset');
    return;
  }
  if(session?.user){
    me=session.user;
    const {data:prof}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();
    if(!prof){
      const code=Math.random().toString(36).slice(2,8).toUpperCase();
      await sb.from('profiles').upsert({id:me.id,username:'',friend_code:code});
      const {data:newProf}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();
      myProfile=newProf;
    } else { myProfile=prof; }
    updateReactionBadge();
    const firstLogin=!localStorage.getItem('onboarded_'+me.id);
    if(firstLogin){ localStorage.setItem('onboarded_'+me.id,'1'); showOnboarding(); }
    else { showScreen('screenFeed'); loadFeed(); }
  } else {
    me=null; myProfile=null;
    showScreen('screenAuth');
  }
});

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('message',(e)=>{
    if(e.data?.type==='SW_NAV' && me){
      showScreen(e.data.screen);
      if(e.data.screen==='screenFeed') loadFeed();
    }
  });
}

// 通知クリックで新規起動した場合: ?screen=feed をチェックしてフィードを開く
const _swNavParam=new URLSearchParams(location.search).get('screen');
if(_swNavParam==='feed'){
  history.replaceState(null,'',location.pathname);
}
</script>
